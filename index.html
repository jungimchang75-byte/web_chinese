<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>교양중국어2 | 고려대학교 중어중문학과</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@500;700&family=Noto+Serif+KR:wght@700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <style>
/* ===== 색과 기본 값 (색을 바꾸려면 여기만 고치세요) ===== */
:root {
  /* 브라운 */
  --brown-900: #45311f;
  --brown-700: #6b4a2e;
  --brown-500: #8f6a45;
  /* 황토 */
  --ochre-700: #94631f;
  --ochre-500: #c68f3e;
  --ochre-300: #e2bd7c;
  /* 옐로 */
  --yellow-200: #f5e2a8;
  --yellow-100: #faf0d2;
  /* 대나무(죽간) */
  --bamboo-light: #ecd59f;
  --bamboo-mid: #dcbb78;
  --bamboo-dark: #b98d4c;
  --ink: #3a2616;
  --cord: #7a4f2a;

  --bg: #f8f1e1;
  --surface: #fffaf0;
  --text: var(--brown-900);
  --text-soft: #75604a;
  --accent: var(--ochre-700);
  --accent-2: var(--brown-500);
  --line: #ead9b8;

  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 8px 22px rgba(120, 82, 40, 0.12);
  --shadow-hover: 0 14px 30px rgba(120, 82, 40, 0.2);
  --header-h: 68px;

  /* 대나무 결 무늬 */
  --grain: repeating-linear-gradient(90deg, rgba(150, 105, 50, 0.035) 0 2px, transparent 2px 26px);
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 12px);
}

body {
  margin: 0;
  font-family: "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 8% 0%, var(--yellow-100) 0, transparent 42%),
    radial-gradient(circle at 92% 18%, rgba(226, 189, 124, 0.35) 0, transparent 45%),
    var(--bg);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

[lang="zh-CN"] { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }

a { color: var(--brown-700); }
h1, h2, h3 { line-height: 1.3; margin: 0; }

.container {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ===== 헤더 ===== */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(248, 241, 225, 0.86);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: box-shadow 0.25s, border-color 0.25s;
}
.site-header.scrolled {
  border-color: var(--line);
  box-shadow: 0 4px 18px rgba(120, 82, 40, 0.1);
}
.header-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 20px;
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  margin-right: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
}
/* 로고: 작은 죽간 한 쪽 */
.brand-logo {
  width: 30px;
  height: 44px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  font-family: "Ma Shan Zheng", "Noto Sans SC", serif;
  font-size: 22px;
  color: var(--ink);
  background:
    linear-gradient(180deg, transparent 22%, var(--cord) 22% 26%, transparent 26% 74%, var(--cord) 74% 78%, transparent 78%),
    linear-gradient(90deg, var(--bamboo-dark), var(--bamboo-light) 30%, var(--bamboo-mid) 75%, var(--bamboo-dark));
  box-shadow: 0 2px 6px rgba(120, 82, 40, 0.25);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-family: "Noto Serif KR", serif; font-size: 18px; }
.brand-text small { font-size: 12px; color: var(--text-soft); }

.site-nav { display: flex; gap: 2px; }
.site-nav a {
  position: relative;
  padding: 8px 11px;
  border-radius: 999px;
  text-decoration: none;
  color: var(--text-soft);
  font-weight: 500;
  font-size: 15px;
  transition: background 0.2s, color 0.2s;
}
.site-nav a:hover { background: var(--yellow-100); color: var(--text); }
.site-nav a.active { background: var(--yellow-200); color: var(--brown-900); }

.menu-toggle {
  display: none;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  background: var(--yellow-200);
  cursor: pointer;
  padding: 12px 11px;
  flex-direction: column;
  justify-content: space-between;
}
.menu-toggle span {
  display: block;
  height: 2px;
  border-radius: 2px;
  background: var(--brown-700);
  transition: transform 0.25s, opacity 0.25s;
}
.menu-open .menu-toggle span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
.menu-open .menu-toggle span:nth-child(2) { opacity: 0; }
.menu-open .menu-toggle span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

/* ===== 첫 화면 ===== */
.hero { padding: 56px 0 48px; }
.hero-inner {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 48px;
  align-items: center;
}
.badge {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--brown-700);
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--line);
}
.hero h1 {
  margin: 18px 0 8px;
  font-family: "Noto Serif KR", serif;
  font-size: clamp(42px, 7vw, 68px);
  font-weight: 900;
  color: var(--brown-900);
}
.hero-subtitle {
  margin: 0 0 18px;
  font-family: "Noto Serif KR", serif;
  font-size: clamp(21px, 2.8vw, 28px);
  font-weight: 700;
  color: var(--ochre-700);
}
.hero-desc { margin: 0 0 28px; max-width: 34em; font-size: clamp(16px, 1.6vw, 18px); }
.hero-buttons { display: flex; flex-wrap: wrap; gap: 12px; }

.btn {
  display: inline-flex;
  align-items: center;
  min-height: 46px;
  padding: 0 24px;
  border-radius: 999px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn:hover { transform: translateY(-2px); }
.btn[hidden] { display: none; }
.btn-primary {
  color: #fffaf0;
  background: linear-gradient(135deg, var(--ochre-500), var(--brown-500));
  box-shadow: var(--shadow-hover);
}
.btn-ghost { color: var(--brown-700); background: var(--surface); border: 1px solid var(--line); }

/* 일정 · 시간 · 수업 방식 · 수강 대상 */
.facts {
  list-style: none;
  margin: 44px 0 0;
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--grain), var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.fact {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
}
.fact + .fact { border-left: 1px dashed var(--line); }
.fact-icon {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 20px;
  background: var(--yellow-100);
}
.fact-label { display: block; font-size: 13px; color: var(--text-soft); }
.fact strong { display: block; font-size: 15px; line-height: 1.4; }

/* 숫자 강조 카드 */
.section-stats { padding: 8px 0 64px; }
.stats { list-style: none; margin: 0; padding: 0; }
.stat { text-align: center; padding: 28px 16px; }
.stat strong { display: block; font-family: "Noto Serif KR", serif; color: var(--accent); line-height: 1.1; }
.stat-value { font-size: clamp(38px, 4.6vw, 52px); font-weight: 900; }
.stat-unit { font-size: 20px; margin-left: 2px; }
.stat-label { display: block; margin-top: 8px; color: var(--text-soft); font-weight: 500; }

/* 죽간 묶음 */
.slips {
  display: flex;
  justify-content: center;
  padding: 10px 0;
}
.slips-row {
  position: relative;
  display: flex;
  flex-direction: row-reverse; /* 오른쪽에서 왼쪽으로 읽기 */
  gap: 5px;
  padding: 0 14px;
}
/* 죽간을 엮은 끈 두 줄 */
.slips-row::before,
.slips-row::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(90deg, transparent, var(--cord) 4%, var(--cord) 96%, transparent);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  z-index: 2;
}
.slips-row::before { top: 16%; }
.slips-row::after { bottom: 16%; }

.slip {
  --tilt: 0deg;
  position: relative;
  width: 48px;
  height: 360px;
  padding: 26px 0;
  border-radius: 8px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 6px;
  font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  font-size: 30px;
  color: var(--ink);
  background:
    var(--grain),
    linear-gradient(90deg, var(--bamboo-dark) 0%, var(--bamboo-light) 22%, var(--bamboo-mid) 70%, var(--bamboo-dark) 100%);
  box-shadow: inset 0 0 0 1px rgba(120, 82, 40, 0.25), 0 6px 14px rgba(120, 82, 40, 0.22);
  transform: rotate(var(--tilt));
}
.slip:nth-child(even) { margin-top: 10px; }
.slip:nth-child(3n) { margin-top: -6px; }

/* ===== 공통 섹션 · 카드 ===== */
.section { padding: 72px 0; position: relative; }
.section-tint { background: linear-gradient(180deg, rgba(245, 226, 168, 0.35), rgba(236, 213, 159, 0.25)); }
.section-head { text-align: center; margin-bottom: 36px; }
.section-title {
  display: inline-block;
  font-family: "Noto Serif KR", serif;
  font-size: clamp(26px, 3.4vw, 34px);
  font-weight: 900;
  position: relative;
  padding-bottom: 14px;
}
/* 제목 아래 가로로 누운 작은 죽간 */
.section-title::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 64px;
  height: 7px;
  border-radius: 4px;
  transform: translateX(-50%);
  background:
    linear-gradient(90deg, transparent 20%, var(--cord) 20% 24%, transparent 24% 76%, var(--cord) 76% 80%, transparent 80%),
    linear-gradient(180deg, var(--bamboo-light), var(--bamboo-dark));
}
.section-lead { margin: 12px auto 0; max-width: 36em; color: var(--text-soft); }

.card {
  background: var(--grain), var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  transition: transform 0.25s, box-shadow 0.25s;
}
.card h3 { font-size: 18px; margin-bottom: 10px; }
.card p { margin: 0; }

.grid { display: grid; gap: 20px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

/* 프로그램 소개 */
.feature:hover, .week:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.feature-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin-bottom: 14px;
  border-radius: 16px;
  font-size: 26px;
  background: linear-gradient(135deg, var(--yellow-100), var(--yellow-200));
}
.feature p { color: var(--text-soft); font-size: 15px; }

.goals { margin-top: 20px; }
.goals ol {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: goal;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px 24px;
}
.goals li { counter-increment: goal; display: flex; gap: 10px; align-items: flex-start; }
.goals li::before {
  content: counter(goal);
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
  color: #fffaf0;
  background: var(--ochre-500);
}

/* 장점 슬라이드 */
.slider { position: relative; }
.slider-track {
  list-style: none;
  margin: 0;
  padding: 8px 4px 20px;
  display: flex;
  gap: 20px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
}
.slider-track::-webkit-scrollbar { display: none; }
.slide {
  flex: 0 0 calc((100% - 40px) / 3);
  scroll-snap-align: start;
  min-height: 230px;
}
.slide p { color: var(--text-soft); }
.slider-btn {
  position: absolute;
  top: 50%;
  z-index: 3;
  width: 46px;
  height: 46px;
  margin-top: -32px;
  border: 1px solid var(--line);
  border-radius: 50%;
  font-size: 28px;
  line-height: 1;
  color: var(--brown-700);
  background: var(--surface);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: opacity 0.2s, transform 0.2s;
}
.slider-btn:hover:not(:disabled) { transform: scale(1.08); }
.slider-btn:disabled { opacity: 0; pointer-events: none; }
.slider-btn.prev { left: -22px; }
.slider-btn.next { right: -22px; }
.slider-dots { display: flex; justify-content: center; gap: 2px; margin-top: 6px; }
/* 손가락으로 누르기 쉽게 버튼은 크게, 보이는 점은 작게 */
.slider-dots button {
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.slider-dots button::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 999px;
  background: var(--ochre-300);
  opacity: 0.5;
  transition: width 0.25s, opacity 0.25s;
}
.slider-dots button.active { width: 40px; }
.slider-dots button.active::before { width: 28px; opacity: 1; background: var(--ochre-500); }

/* AI 도구 */
.tools { list-style: none; margin: 0; padding: 0; }
.tool p { color: var(--text-soft); font-size: 15px; }
.tool:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

/* 수강 준비물 */
.materials { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.materials li { display: flex; gap: 12px; align-items: flex-start; }
.materials strong { display: block; }
.materials span:not(.tag) { display: block; font-size: 14px; color: var(--text-soft); }
.tag {
  flex: none;
  margin-top: 2px;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.tag-req { color: #fffaf0; background: var(--ochre-700); }
.tag-opt { color: var(--brown-700); background: var(--yellow-200); }

/* 커리큘럼: 주차별 펼침 목록, 카드 왼쪽에 죽간 띠 */
.week-list { max-width: 920px; margin: 0 auto; display: grid; gap: 12px; }
.week-item {
  position: relative;
  padding: 0 0 0 18px;
  overflow: hidden;
}
.week-item > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 56px 18px 22px;
  position: relative;
}
.week-item > summary::-webkit-details-marker { display: none; }
.week-item > summary::after {
  content: "+";
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--brown-700);
  background: var(--yellow-200);
}
.week-item[open] > summary::after { content: "−"; }
.week-item[open] > summary { border-bottom: 1px dashed var(--line); }
.week-sum { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.week-sum strong { font-size: 17px; }
.week-date { font-size: 14px; color: var(--text-soft); }
.week-num { flex: none; }
.tag-hw { color: #fffaf0; background: var(--ochre-500); }
.tag-exam { color: #fffaf0; background: var(--brown-500); }

.week-body { padding: 18px 22px 22px; }
.week-body h4 { margin: 18px 0 8px; font-size: 15px; color: var(--brown-700); }
.week-meta {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
}
.week-meta div { padding: 10px 14px; border-radius: var(--radius-sm); background: var(--yellow-100); }
.week-meta dt { font-size: 12px; font-weight: 700; color: var(--text-soft); }
.week-meta dd { margin: 2px 0 0; font-weight: 500; }
.week-content { margin: 0; padding-left: 20px; }
.week-content li + li { margin-top: 4px; }
.week-content li::marker { color: var(--ochre-500); }
.video-links { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.video-links a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  text-decoration: none;
  font-weight: 500;
}
.video-links a:hover { background: var(--yellow-100); }
.video-links span { color: var(--ochre-700); font-size: 12px; }

.assignment {
  margin-top: 20px;
  padding: 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--ochre-300);
  background: linear-gradient(135deg, #fff6df, var(--yellow-100));
}
.assignment-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.assignment p { margin: 0 0 14px; }
.assignment-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.due { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.due-label { font-size: 13px; color: var(--text-soft); }
.countdown {
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
}
.countdown.is-open { color: var(--brown-700); background: var(--yellow-200); }
.countdown.is-urgent { color: #fff; background: #b5532d; }
.countdown.is-closed { color: var(--text-soft); background: #ece3d1; }
.btn-sm { min-height: 40px; padding: 0 18px; font-size: 14px; }
.btn.is-disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

/* 수업 달력 */
.cal-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-title { margin: 0; font-family: "Noto Serif KR", serif; font-size: 22px; }
.cal-nav {
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 50%;
  font-size: 24px;
  line-height: 1;
  color: var(--brown-700);
  background: var(--surface);
  cursor: pointer;
}
.cal-nav:hover { background: var(--yellow-100); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-weekdays span { text-align: center; font-size: 13px; font-weight: 700; color: var(--text-soft); padding-bottom: 4px; }
.cal-weekdays span:first-child { color: #b5532d; }
.cal-day {
  position: relative;
  min-height: 64px;
  padding: 6px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: rgba(255, 250, 240, 0.7);
  color: var(--text);
  font: inherit;
  text-align: left;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.cal-day:hover { border-color: var(--ochre-300); }
.cal-day.is-out { opacity: 0.4; }
.cal-num { font-size: 14px; font-weight: 500; }
.cal-tag {
  font-size: 11px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 999px;
  color: #fffaf0;
  background: var(--ochre-500);
}
.cal-day.is-class { background: var(--grain), linear-gradient(180deg, var(--bamboo-light), var(--bamboo-mid)); }
.cal-day.is-exam .cal-tag { background: var(--brown-500); }
.cal-day.has-due { background: #fbe9df; }
.cal-day.is-holiday { background: #f1e6d4; }
.cal-day.is-holiday .cal-tag { background: #a3927a; }
.cal-dot {
  position: absolute;
  right: 7px;
  top: 8px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #b5532d;
}
.cal-day.is-today .cal-num {
  display: inline-grid;
  place-items: center;
  min-width: 24px;
  height: 24px;
  border-radius: 50%;
  color: #fffaf0;
  background: var(--brown-700);
}
.cal-day.is-selected { border-color: var(--brown-700); box-shadow: 0 0 0 2px var(--ochre-300); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 13px; color: var(--text-soft); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; }
.lg-class { background: linear-gradient(180deg, var(--bamboo-light), var(--bamboo-mid)); }
.lg-due { border-radius: 50% !important; width: 10px !important; height: 10px !important; background: #b5532d; }
.lg-holiday { background: #f1e6d4; border: 1px solid #d8c8ad; }

.cal-detail { position: sticky; top: calc(var(--header-h) + 16px); }
.cal-detail h3 { font-family: "Noto Serif KR", serif; font-size: 20px; margin-bottom: 14px; }
.cal-detail .week-meta { grid-template-columns: 1fr; margin-bottom: 14px; }
.cal-detail p { margin: 0 0 10px; }
.detail-date { color: var(--ochre-700); font-weight: 700; margin-bottom: 4px !important; }
.detail-empty { color: var(--text-soft); }
.detail-hw { margin: 14px 0 !important; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.detail-due {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: #fbe9df;
  color: #8a3b1e;
}
.detail-due ul { margin: 6px 0 0; padding-left: 18px; }
.open-week { margin-top: 6px; cursor: pointer; font-family: inherit; }

.week-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 18px;
  background:
    linear-gradient(180deg, transparent 18%, var(--cord) 18% 21%, transparent 21% 79%, var(--cord) 79% 82%, transparent 82%),
    linear-gradient(90deg, var(--bamboo-dark), var(--bamboo-light) 40%, var(--bamboo-mid));
}
.week-num {
  align-self: flex-start;
  padding: 3px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  color: var(--brown-700);
  background: var(--yellow-200);
}
.week-expr { font-size: 17px; font-weight: 500; color: var(--accent); }
.week-note { color: var(--text-soft); font-size: 14px; }
.week-exam {
  background: var(--grain), linear-gradient(135deg, var(--yellow-100), #f3dfae);
  border-color: var(--ochre-300);
}
.week-exam .week-num { background: var(--brown-500); color: #fffaf0; }

/* 수강 안내 */
.info-list {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 10px 18px;
  margin: 0;
}
.info-list dt { font-weight: 700; color: var(--brown-700); }
.info-list dd { margin: 0; overflow-wrap: anywhere; }

.grading { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.grading-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
.grading-row strong { color: var(--accent); }
.bar { height: 10px; border-radius: 999px; background: var(--yellow-100); overflow: hidden; }
.bar span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--ochre-300), var(--ochre-500));
}

.notes { margin-top: 20px; }
.notes ul { margin: 0; padding-left: 20px; }
.notes li + li { margin-top: 6px; }
.notes li::marker { color: var(--ochre-500); }

/* FAQ */
.faq-list { max-width: 820px; margin: 0 auto; display: grid; gap: 14px; }
.faq-item { padding: 0; }
.faq-item summary {
  list-style: none;
  cursor: pointer;
  padding: 20px 56px 20px 24px;
  font-weight: 700;
  position: relative;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::after {
  content: "+";
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--brown-700);
  background: var(--yellow-200);
}
.faq-item[open] summary::after { content: "−"; }
.faq-item p { padding: 0 24px 22px; color: var(--text-soft); }

/* ===== 메뉴 배지 · 자물쇠 ===== */
.nav-badge {
  display: inline-grid;
  place-items: center;
  min-width: 18px;
  height: 18px;
  margin-left: 4px;
  padding: 0 5px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: #b5532d;
  vertical-align: 1px;
}
.admin-lock {
  flex: none;
  width: 40px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--brown-700);
  background: var(--surface);
  cursor: pointer;
  transition: background 0.2s;
}
.admin-lock:hover { background: var(--yellow-100); }
.admin-lock.is-open { color: #fffaf0; background: var(--brown-700); border-color: var(--brown-700); }
.admin-lock.is-open .lock-shackle { transform: translate(-4px, -2px) rotate(-18deg); transform-origin: 16px 11px; }

/* ===== 공지사항 ===== */
.section-notice { padding-top: 24px; }
.notice-list { max-width: 880px; margin: 0 auto; display: grid; gap: 10px; }
.notice-item { padding: 0; }
.notice-item > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 20px;
}
.notice-item > summary::-webkit-details-marker { display: none; }
.notice-title { flex: 1; min-width: 0; font-weight: 700; }
.notice-date { flex: none; font-size: 13px; color: var(--text-soft); }
.notice-item.is-pinned { border-color: var(--ochre-300); }
.notice-body { padding: 0 20px 18px; color: var(--text-soft); border-top: 1px dashed var(--line); padding-top: 14px; }
.tag-new { color: #fff; background: #b5532d; }
.notice-pager { max-width: 880px; margin: 18px auto 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.pager-btn {
  min-width: 40px; height: 40px; padding: 0 10px; border: 0; border-radius: 12px;
  font: inherit; font-weight: 700; color: var(--green-700); background: var(--surface);
  box-shadow: var(--raise); cursor: pointer;
}
.pager-btn:hover:not(:disabled) { box-shadow: var(--raise-hover); }
.pager-btn.is-current { color: #fff; background: var(--green-700); }
.pager-btn:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
.pager-info { margin-left: 6px; font-size: 13px; color: var(--text-soft); }
.notice-list:focus { outline: none; }
.notice-empty { max-width: 880px; margin: 0 auto; text-align: center; color: var(--text-soft); }

/* ===== 관리자 화면 ===== */
body.admin-open { overflow: hidden; }
.admin {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.ad-head {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px 20px;
  color: #fffaf0;
  background: linear-gradient(180deg, #5a3e26, #45311f);
}
.ad-head strong { font-family: "Noto Serif KR", serif; font-size: 18px; }
.ad-site { color: var(--ochre-300); font-size: 14px; }
.ad-head-actions { margin-left: auto; display: flex; gap: 8px; }
.ad-head .btn-ghost { background: rgba(255, 250, 240, 0.1); color: #fffaf0; border-color: rgba(255, 250, 240, 0.3); }
.ad-body { flex: 1; min-height: 0; display: flex; }
.ad-tabs {
  flex: none;
  width: 190px;
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-right: 1px solid var(--line);
  background: #f3e8d2;
  overflow-y: auto;
}
.ad-tabs button {
  text-align: left;
  min-height: 42px;
  padding: 8px 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}
.ad-tabs button:hover { background: var(--yellow-100); }
.ad-tabs button.active { background: var(--brown-700); color: #fffaf0; }
.ad-content { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.ad-main { flex: 1; overflow-y: auto; padding: 22px 26px 40px; }
.ad-title { margin: 0 0 14px; font-family: "Noto Serif KR", serif; font-size: 22px; }
.ad-help { margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--yellow-100); font-size: 14px; }
.ad-help.small { padding: 0; background: none; color: var(--text-soft); font-size: 13px; }
.ad-flash { margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; background: #eef3e6; color: #4f7a3a; font-weight: 700; }
.ad-savebar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 26px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.ad-savebar[hidden] { display: none; }
.ad-dirty { margin-right: auto; font-size: 14px; color: var(--text-soft); }
.ad-savebar.is-dirty .ad-dirty { color: #b5532d; font-weight: 700; }
.ad-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.ad-select { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-weight: 700; }
.ad-select select { min-height: 42px; padding: 6px 12px; border: 1px solid #dcc8a4; border-radius: 10px; font: inherit; background: #fff; }
.ad-empty { padding: 24px; text-align: center; color: var(--text-soft); border: 1px dashed var(--line); border-radius: 12px; }
.ad-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.ad-card { padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.ad-card h4 { margin: 0 0 6px; font-size: 16px; }
.ad-card p { margin: 0 0 12px; font-size: 14px; color: var(--text-soft); }
.ad-card .ad-help.small { margin-top: 10px; }
.btn.danger { color: #8a3b1e; border-color: #e8b29a; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.file-btn { position: relative; cursor: pointer; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.file-btn:focus-within { outline: 3px solid var(--ochre-300); outline-offset: 2px; }
.link-btn { border: 0; background: none; padding: 4px 6px; color: var(--brown-700); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; }

/* 편집기 */
.ed-root { display: grid; gap: 14px; max-width: 900px; }
.ed-group { margin: 0; padding: 14px 16px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: grid; gap: 12px; min-width: 0; }
.ed-group > legend { padding: 0 6px; font-weight: 700; color: var(--brown-700); }
.ed-group legend small { font-weight: 500; color: var(--text-soft); }
.ed-group .ed-group { background: #fdf8ec; }
.ed-field { display: grid; gap: 4px; min-width: 0; }
.ed-field span { font-size: 13px; font-weight: 700; color: var(--text-soft); }
.ed-field input, .ed-field textarea, .ad-inline input, .notice-form textarea {
  width: 100%;
  min-height: 40px;
  padding: 8px 12px;
  border: 1px solid #dcc8a4;
  border-radius: 10px;
  background: #fff;
  font: inherit;
  color: var(--text);
}
.ed-field textarea { resize: vertical; }
.ed-field input:focus, .ed-field textarea:focus, .ad-inline input:focus { outline: none; border-color: var(--ochre-500); box-shadow: 0 0 0 3px rgba(198, 143, 62, 0.25); }
.ed-check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.ed-check input { width: 18px; height: 18px; accent-color: var(--ochre-700); }
.ed-item { padding: 12px; border: 1px dashed #dcc8a4; border-radius: 12px; display: grid; gap: 10px; background: #fff; }
.ed-item-head { display: flex; align-items: center; justify-content: space-between; }
.ed-item-head strong { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 13px; color: #fffaf0; background: var(--ochre-500); }
.ed-row { display: flex; align-items: flex-end; gap: 8px; }
.ed-row .ed-field { flex: 1; }
.ed-tools { display: inline-flex; gap: 4px; }
.ed-tools button, .ed-add {
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--brown-700);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.ed-tools button:disabled { opacity: 0.35; cursor: default; }
.ed-tools button[data-op="del"] { color: #8a3b1e; }
.ed-add { justify-self: start; font-weight: 700; border-style: dashed; }

/* 명단 · 공지 입력 */
.ad-inline { display: flex; flex-wrap: wrap; gap: 8px; }
.ad-inline input { flex: 1 1 140px; width: auto; }
.notice-form { display: grid; gap: 10px; max-width: 720px; margin-bottom: 20px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.notice-form .btn { justify-self: start; }

/* 표 */
.ad-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.ad-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ad-table th, .ad-table td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap; }
.ad-table th { position: sticky; top: 0; background: #f3e8d2; font-size: 13px; color: var(--brown-700); }
.ad-table tbody tr:hover { background: var(--yellow-100); }
.ad-table .ok { color: #4f7a3a; font-weight: 700; }
.ad-table small { color: var(--text-soft); }

/* ===== 실시간 퀴즈 ===== */
:root {
  --qz-0: #c0563b; /* ▲ 주홍 */
  --qz-1: #2f7d8c; /* ◆ 청록 */
  --qz-2: #b07c1e; /* ● 황토 */
  --qz-3: #5f8a3c; /* ■ 쑥색 */
}
.quiz-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; max-width: 900px; margin: 0 auto; }
.quiz-join { display: grid; gap: 14px; align-content: start; }
.quiz-join h3, .quiz-host-card h3 { margin: 0; }
.quiz-pin { font-size: 26px !important; font-weight: 800; letter-spacing: 6px; text-align: center; }
.quiz-host-card { display: grid; gap: 12px; align-content: start; }
.quiz-host-card p { margin: 0; color: var(--text-soft); }
.quiz-offline { max-width: 900px; margin: 0 auto 16px; color: #8a3b1e; background: #fdf0ea; border-color: #e8b29a; }
body.qz-open { overflow: hidden; }

.qz {
  position: fixed;
  inset: 0;
  z-index: 210;
  display: flex;
  flex-direction: column;
  background: var(--grain), radial-gradient(circle at 20% 0%, var(--yellow-100), transparent 50%), var(--bg);
}
.qz .qz-bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  color: #fffaf0;
  background: linear-gradient(180deg, #5a3e26, #45311f);
}
.qz-bar strong { font-family: "Noto Serif KR", serif; font-size: 17px; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.qz-me { font-size: 14px; color: var(--ochre-300); }
.qz-score { font-weight: 800; padding: 2px 10px; border-radius: 999px; background: rgba(255, 250, 240, 0.15); }
.qz-x { flex: none; width: 38px; height: 38px; border: 0; border-radius: 50%; font-size: 22px; color: #fffaf0; background: rgba(255, 250, 240, 0.15); cursor: pointer; }
.qz-bar .btn-ghost { background: rgba(255, 250, 240, 0.1); color: #fffaf0; border-color: rgba(255, 250, 240, 0.3); }
.qz-pin-chip { font-size: 14px; padding: 4px 12px; border-radius: 999px; background: rgba(255, 250, 240, 0.15); }
.qz-pin-chip b { font-size: 17px; letter-spacing: 2px; }
.qz-stage { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 28px; width: 100%; max-width: 1100px; margin: 0 auto; }
.qz-conn { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; color: #fff; background: #8a3b1e; font-size: 14px; }
.qz-center { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.qz-center p { margin: 0; }
.qz-big { margin: 0; font-family: "Noto Serif KR", serif; font-size: clamp(24px, 4vw, 34px); font-weight: 900; }
.qz-small { margin: 0; font-size: 14px; color: var(--text-soft); }
.qz-name { font-size: 22px; font-weight: 800; color: var(--accent); }
.qz-count { color: var(--text-soft); }
.qz-dots { display: flex; gap: 8px; margin-top: 8px; }
.qz-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--ochre-500); animation: qzBlink 1.2s infinite; }
.qz-dots i:nth-child(2) { animation-delay: 0.2s; }
.qz-dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes qzBlink { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

.qz-q-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; color: var(--brown-700); }
.qz-timer { font-variant-numeric: tabular-nums; }
.qz-q-head > .qz-timer { min-width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: #fffaf0; background: var(--brown-700); }
.qz-timer-big { font-size: 22px; }
.qz-timer-big b { font-size: 34px; }
.qz-timebar { height: 8px; margin: 10px 0 16px; border-radius: 999px; background: var(--yellow-200); overflow: hidden; }
.qz-timebar span { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--ochre-500), var(--brown-500)); transition: width 0.1s linear; }
.qz-question { margin: 0 0 18px; font-size: clamp(19px, 3vw, 26px); font-weight: 800; line-height: 1.45; text-align: center; }
.qz-question-big { font-size: clamp(24px, 4vw, 40px); margin: 10px 0 26px; }
.qz-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.qz-choice {
  min-height: 92px;
  padding: 14px 16px;
  border: 0;
  border-radius: 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: #fff;
  font: inherit;
  font-size: 18px;
  font-weight: 700;
  text-align: left;
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
  cursor: pointer;
  transition: transform 0.1s, opacity 0.2s, box-shadow 0.1s;
}
button.qz-choice:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
.qz-choice:disabled { cursor: default; opacity: 0.4; }
.qz-choice.is-picked { opacity: 1; outline: 4px solid var(--brown-900); outline-offset: 2px; }
.qz-choices-host .qz-choice { cursor: default; min-height: 110px; font-size: clamp(18px, 2.4vw, 26px); }
.qz-shape { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; background: rgba(255, 255, 255, 0.22); }
.c0 { background-color: var(--qz-0); }
.c1 { background-color: var(--qz-1); }
.c2 { background-color: var(--qz-2); }
.c3 { background-color: var(--qz-3); }
.qz-answer-msg { margin: 12px 0 0; text-align: center; color: #8a3b1e; font-weight: 700; min-height: 1.4em; }
.qz-picked { width: 96px; height: 96px; border-radius: 24px; display: grid; place-items: center; font-size: 46px; color: #fff; }

.qz-result { margin: 0 auto 16px; max-width: 520px; padding: 22px; border-radius: 22px; text-align: center; color: #fff; display: grid; gap: 4px; }
.qz-result b { font-size: 30px; }
.qz-result span { font-size: 18px; font-weight: 700; }
.qz-result.ok { background: #5f8a3c; }
.qz-result.no { background: #b0473a; }
.qz-result.none { background: #8f7a64; }
.qz-reveal-box { max-width: 520px; margin: 0 auto; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
.qz-correct { margin: 6px 0 10px; padding: 12px; border-radius: 14px; color: #fff; font-size: 18px; font-weight: 800; }
.qz-expl { margin: 0 0 10px; color: var(--text-soft); }
.qz-rank { margin: 0; font-size: 17px; }
.qz-rank b { color: var(--accent); }
.qz-medal { font-size: 64px; line-height: 1; }
.qz-top { list-style: none; margin: 8px 0; padding: 0; width: min(360px, 100%); display: grid; gap: 6px; }
.qz-top li { display: flex; justify-content: space-between; padding: 8px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }

/* 교수자: 만들기 */
.qz-build { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.qz-build-main { overflow-y: auto; padding: 18px 22px 30px; display: grid; gap: 14px; align-content: start; }
.qz-build-side { overflow-y: auto; padding: 18px; border-left: 1px solid var(--line); background: #f3e8d2; }
.qz-build-foot { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--surface); }
.qz-build-foot .form-msg { flex: 1 1 200px; margin: 0 !important; min-height: 0; }
.qz-build-info { font-size: 14px; color: var(--text-soft); }
.qz-pass { min-height: 40px; padding: 6px 12px; border: 1px solid #dcc8a4; border-radius: 10px; font: inherit; }
.qz-sets { display: flex; flex-wrap: wrap; gap: 8px; }
.qz-sets select { min-height: 40px; padding: 6px 10px; border: 1px solid #dcc8a4; border-radius: 10px; font: inherit; background: #fff; max-width: 100%; }
.qz-qlist { display: grid; gap: 12px; }
.qz-qcard { padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); display: grid; gap: 10px; }
.qz-qcard-head { display: flex; justify-content: space-between; align-items: center; }
.qz-qcard-head strong { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #fffaf0; background: var(--brown-700); }
.qz-qchoices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.qz-qchoice { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; border-radius: 12px; }
.qz-qchoice .qz-shape { width: 30px; height: 30px; font-size: 15px; color: #fff; }
.qz-qchoice input[type="radio"] { width: 20px; height: 20px; margin: 0 0 0 4px; accent-color: #fff; flex: none; }
.qz-qchoice input[type="text"] { flex: 1; min-width: 0; min-height: 38px; padding: 6px 10px; border: 0; border-radius: 8px; font: inherit; background: rgba(255, 255, 255, 0.92); }
.qz-qchoice:has(input[type="radio"]:checked) { outline: 3px solid var(--brown-900); }
.qz-qmeta { display: grid; grid-template-columns: 120px 1fr; gap: 10px; }
.qz-qmeta select { min-height: 40px; padding: 6px 10px; border: 1px solid #dcc8a4; border-radius: 10px; font: inherit; background: #fff; }
.qz-ai { display: grid; gap: 12px; }
.qz-ai h3 { margin: 0; }
.qz-ai .small-note { margin: 0 !important; }
.qz-ai select, .qz-ai .ed-field input, .qz-paste textarea { width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid #dcc8a4; border-radius: 10px; font: inherit; background: #fff; }
.qz-ai-row { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 8px; }
.qz-paste { display: grid; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.qz-paste[open] { display: grid; }
.qz-paste summary { cursor: pointer; font-weight: 700; color: var(--brown-700); }
.qz-paste > * + * { margin-top: 8px; }

/* 교수자: 진행 */
.qz-lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.qz-join-box { padding: 22px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); text-align: center; display: grid; gap: 10px; justify-items: center; }
.qz-qr { min-width: 220px; min-height: 220px; padding: 10px; border-radius: 14px; background: #fffaf0; display: grid; place-items: center; }
.qz-qr img, .qz-qr canvas { display: block; }
.qz-pin { margin: 0; font-size: clamp(40px, 7vw, 64px); font-weight: 900; letter-spacing: 6px; color: var(--brown-900); line-height: 1.1; }
.qz-url { margin: 0; font-size: 14px; color: var(--text-soft); overflow-wrap: anywhere; }
.qz-wait { display: grid; gap: 14px; align-content: start; }
.qz-chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; }
.qz-chips li { padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; animation: qzPop 0.3s; }
@keyframes qzPop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
.qz-go { min-height: 54px; font-size: 18px; justify-content: center; }
.qz-host-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.qz-host-msg { margin: 0; flex-basis: 100%; text-align: right; color: var(--text-soft); font-size: 14px; }
.qz-reveal { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.qz-dist { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; min-height: 230px; }
.qz-dist-col { display: flex; flex-direction: column; align-items: stretch; gap: 6px; background: none !important; }
.qz-dist-n { text-align: center; font-size: 22px; font-weight: 800; }
.qz-dist-bar { border-radius: 10px 10px 4px 4px; transition: height 0.5s; }
.qz-dist-col.c0 .qz-dist-bar { background: var(--qz-0); }
.qz-dist-col.c1 .qz-dist-bar { background: var(--qz-1); }
.qz-dist-col.c2 .qz-dist-bar { background: var(--qz-2); }
.qz-dist-col.c3 .qz-dist-bar { background: var(--qz-3); }
.qz-dist-col.is-wrong { opacity: 0.4; }
.qz-dist-label { font-size: 14px; font-weight: 700; text-align: center; overflow-wrap: anywhere; }
.qz-side h4 { margin: 0 0 8px; }
.qz-board { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.qz-board li { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.qz-board-rank { font-weight: 800; color: var(--accent); }
.qz-board-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qz-final-host { display: grid; gap: 16px; max-width: 760px; margin: 0 auto; text-align: center; }
.qz-final-host .qz-board { text-align: left; max-height: 40vh; overflow-y: auto; }
.qz-podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: end; }
.qz-pod { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.qz-pod-name { font-weight: 800; overflow-wrap: anywhere; }
.qz-pod-score { color: var(--text-soft); font-size: 14px; }
.qz-pod-block { width: 100%; display: grid; place-items: center; border-radius: 14px 14px 0 0; color: #fffaf0; font-size: 32px; font-weight: 900; }
.qz-pod.p1 .qz-pod-block { height: 150px; background: linear-gradient(180deg, #d9a53f, #a8761f); }
.qz-pod.p2 .qz-pod-block { height: 110px; background: linear-gradient(180deg, #a9a49b, #7d776d); }
.qz-pod.p3 .qz-pod-block { height: 80px; background: linear-gradient(180deg, #c48a5a, #8f5d36); }

/* ===== 참여 기능 공통 ===== */
.small-note { margin: 14px 0 0 !important; font-size: 13px; color: var(--text-soft); }
.form-msg { margin: 10px 0 0 !important; min-height: 1.4em; font-size: 14px; font-weight: 500; }
.form-msg.is-error { color: #b5532d; }
.form-msg.is-ok { color: #4f7a3a; }
.btn-xs { min-height: 30px; padding: 0 12px; font-size: 13px; }
button.btn { border: 0; cursor: pointer; font-family: inherit; }
button.btn-ghost { border: 1px solid var(--line); }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.chip-ok { color: #fff; background: #6c8f4e; }
.chip-miss { color: #8a3b1e; background: #fbe0d4; }
.chip-wait { color: var(--brown-700); background: var(--yellow-200); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head h3 { margin: 0; }
.rate { font-size: 14px; color: var(--text-soft); }
.rate strong { color: var(--accent); font-size: 17px; }

/* 주제 투표 */
.poll-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
.poll-form fieldset { border: 0; margin: 0 0 16px; padding: 0; }
.poll-form legend { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.poll-options { display: grid; gap: 8px; }
.poll-option {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.poll-option:hover { border-color: var(--ochre-300); }
.poll-option:has(input:checked) { border-color: var(--ochre-500); background: var(--yellow-100); }
.poll-option input { accent-color: var(--ochre-700); width: 18px; height: 18px; margin: 0; }
.poll-icon { font-size: 20px; }
.poll-result-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.poll-result-head h3 { margin: 0; }
.poll-total { font-weight: 700; color: var(--accent); }
.poll-bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.poll-bar-label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 15px; }
.poll-bar-label strong { flex: none; color: var(--text-soft); font-size: 14px; }
.poll-bar .bar { height: 14px; }
.poll-bar .bar span { transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
.poll-bar.is-top .bar span { background: linear-gradient(90deg, var(--ochre-500), var(--brown-500)); }
.poll-bar.is-top .poll-bar-label strong { color: var(--accent); }
.mine-tag {
  display: none;
  margin-left: 6px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 11px;
  font-style: normal;
  font-weight: 700;
  color: #fffaf0;
  background: var(--ochre-700);
  vertical-align: 2px;
}
.poll-bar.is-mine .mine-tag { display: inline-block; }

/* 수강 신청서 */
.apply-form, .apply-done, .login-form { max-width: 820px; margin: 0 auto; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 20px; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; margin: 0; padding: 0; min-width: 0; }
.field-wide { grid-column: 1 / -1; }
.field > label, .field legend { font-weight: 700; font-size: 15px; padding: 0; }
.req { color: #b5532d; }
.field input:not([type="radio"]):not([type="checkbox"]), .field select, .field textarea {
  width: 100%;
  min-height: 46px;
  padding: 10px 14px;
  border: 1px solid #dcc8a4;
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  font: inherit;
}
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ochre-500); box-shadow: 0 0 0 3px rgba(198, 143, 62, 0.25); }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.choice { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; cursor: pointer; font-weight: 500; }
.choice input { accent-color: var(--ochre-700); width: 18px; height: 18px; margin: 0; }
.field-error { margin: 0; font-size: 13px; font-weight: 500; color: #b5532d; }
.field-error::before { content: "⚠ "; }
.has-error input:not([type="radio"]):not([type="checkbox"]), .has-error select, .has-error textarea { border-color: #b5532d; background: #fff8f5; }
.error-summary {
  margin-bottom: 20px;
  padding: 16px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid #e8b29a;
  background: #fdf0ea;
  color: #8a3b1e;
}
.error-summary:focus { outline: 3px solid #e8b29a; }
.error-summary ul { margin: 8px 0 0; padding-left: 20px; }
.error-summary a { color: #8a3b1e; font-weight: 500; }
.form-actions { margin-top: 24px; display: flex; justify-content: flex-end; }
.apply-done { text-align: center; }
.apply-done:focus { outline: none; }
.done-mark {
  display: inline-grid;
  place-items: center;
  width: 64px;
  height: 64px;
  margin-bottom: 12px;
  border-radius: 50%;
  font-size: 30px;
  color: #fffaf0;
  background: linear-gradient(135deg, var(--ochre-500), var(--brown-500));
}
.apply-done h3 { font-family: "Noto Serif KR", serif; font-size: 24px; }
.done-no { margin: 8px 0 !important; color: var(--text-soft); }
.done-no strong { color: var(--accent); font-size: 18px; }
.done-summary {
  margin: 20px auto;
  max-width: 520px;
  display: grid;
  gap: 8px;
  text-align: left;
  padding: 16px 18px;
  border-radius: var(--radius-sm);
  background: var(--yellow-100);
}
.done-summary div { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
.done-summary dt { font-weight: 700; color: var(--brown-700); }
.done-summary dd { margin: 0; overflow-wrap: anywhere; }

/* 내 강의실 */
.login-form { max-width: 440px; display: grid; gap: 16px; }
.login-form h3 { margin: 0; }
.class-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.class-head h3 { font-family: "Noto Serif KR", serif; font-size: 22px; margin: 0; }
.class-head p { margin: 2px 0 0; color: var(--text-soft); }
.class-head .eyebrow { margin: 0; font-size: 13px; color: var(--ochre-700); font-weight: 700; }
.class-grid { align-items: start; }
.today-box {
  padding: 16px;
  border-radius: var(--radius-sm);
  background: var(--yellow-100);
  border: 1px dashed var(--ochre-300);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.today-box p { margin: 0; font-weight: 500; }
.today-box small { color: var(--text-soft); }
.today-box.is-done { color: #4f7a3a; font-weight: 700; background: #eef3e6; border-color: #b9cc9f; }
.today-box.is-off { flex-direction: column; align-items: flex-start; gap: 2px; }
.attend-list { list-style: none; margin: 14px 0 0; padding: 0; max-height: 420px; overflow-y: auto; }
.attend-list li {
  display: grid;
  grid-template-columns: 52px 1fr auto auto;
  align-items: center;
  gap: 8px;
  padding: 8px 4px;
  border-bottom: 1px dashed var(--line);
  font-size: 14px;
}
.att-week { font-weight: 700; color: var(--brown-700); }
.att-date { color: var(--text-soft); }
.att-status { display: flex; align-items: center; gap: 6px; justify-self: end; }
.att-status small { color: var(--text-soft); font-size: 12px; }
.sub-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.sub-item { padding: 14px; border-radius: var(--radius-sm); background: rgba(250, 240, 210, 0.5); border: 1px solid var(--line); }
.sub-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub-due { margin: 4px 0 0 !important; font-size: 13px; color: var(--text-soft); }
.sub-status { margin: 8px 0 0 !important; font-size: 14px; color: #4f7a3a; overflow-wrap: anywhere; }
.sub-locked { margin: 8px 0 0 !important; font-size: 14px; color: var(--text-soft); }
.sub-form { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sub-form .form-msg { flex-basis: 100%; margin: 0 !important; min-height: 0; }
.file-pick { position: relative; cursor: pointer; }
.file-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.file-pick:focus-within .btn { outline: 3px solid var(--ochre-300); outline-offset: 2px; }
.file-name { flex: 1; min-width: 120px; font-size: 13px; color: var(--text-soft); overflow-wrap: anywhere; }

/* 안내 팝업 */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(58, 38, 22, 0.45);
  opacity: 0;
  transition: opacity 0.25s;
}
.modal-backdrop.show { opacity: 1; }
.modal {
  position: relative;
  width: min(440px, 100%);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--grain), var(--surface);
  box-shadow: 0 24px 60px rgba(58, 38, 22, 0.35);
  transform: translateY(16px) scale(0.98);
  transition: transform 0.25s;
}
.modal-backdrop.show .modal { transform: none; }
.modal::before {
  content: "";
  display: block;
  height: 10px;
  background:
    linear-gradient(90deg, transparent 15%, var(--cord) 15% 17%, transparent 17% 83%, var(--cord) 83% 85%, transparent 85%),
    linear-gradient(180deg, var(--bamboo-light), var(--bamboo-dark));
}
.modal-body { padding: 26px 26px 22px; }
.modal-body h2 { margin: 14px 0 10px; font-family: "Noto Serif KR", serif; font-size: 23px; }
.modal-body p { margin: 0 0 12px; }
.modal-points { margin: 0 0 20px; padding-left: 20px; color: var(--text-soft); }
.modal-points li::marker { color: var(--ochre-500); }
.modal-cta { width: 100%; justify-content: center; }
.modal-close {
  position: absolute;
  top: 18px;
  right: 14px;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  font-size: 22px;
  color: var(--brown-700);
  background: var(--yellow-100);
  cursor: pointer;
}
.modal-foot { display: flex; border-top: 1px solid var(--line); }
.modal-foot button {
  flex: 1;
  min-height: 48px;
  border: 0;
  background: #f6ecd6;
  color: var(--brown-700);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.modal-foot button + button { border-left: 1px solid var(--line); font-weight: 700; }
.modal-foot button:hover { background: var(--yellow-200); }

/* 첫 방문 환영 */
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 120; pointer-events: none; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 110;
  max-width: calc(100% - 32px);
  padding: 14px 22px;
  border-radius: 999px;
  color: #fffaf0;
  background: var(--brown-700);
  box-shadow: var(--shadow-hover);
  font-weight: 500;
  text-align: center;
  transform: translate(-50%, 20px);
  opacity: 0;
  transition: opacity 0.35s, transform 0.35s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 푸터 — 교수자 */
.site-footer {
  padding: 56px 0 28px;
  color: #f4e6c8;
  background:
    repeating-linear-gradient(90deg, rgba(255, 240, 200, 0.04) 0 2px, transparent 2px 30px),
    linear-gradient(180deg, #5a3e26, #3f2a19);
}
.footer-profile {
  display: grid;
  grid-template-columns: auto 1fr minmax(240px, 320px);
  gap: 32px;
  align-items: center;
}
.footer-eyebrow { margin: 0 0 4px; font-size: 13px; letter-spacing: 2px; color: var(--ochre-300); }
.site-footer h2 { font-family: "Noto Serif KR", serif; font-size: 26px; color: #fffaf0; }
.site-footer h2 small { font-family: "Noto Sans KR", sans-serif; font-size: 15px; font-weight: 500; color: #d9c49c; }
.site-footer .profile-aff { margin: 4px 0 10px; color: var(--ochre-300); font-weight: 500; }
.profile-bio { margin: 0; color: #e6d5b3; }
.footer-contacts {
  margin: 0;
  padding: 18px 20px;
  border-radius: var(--radius-sm);
  background: rgba(255, 245, 220, 0.08);
  border: 1px solid rgba(255, 240, 200, 0.15);
  display: grid;
  gap: 10px;
}
.footer-contacts div { display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
.footer-contacts dt { font-weight: 700; color: var(--ochre-300); }
.footer-contacts dd { margin: 0; overflow-wrap: anywhere; }
.footer-contacts a { color: #fffaf0; }
.footer-bottom {
  margin: 40px 0 0;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 240, 200, 0.15);
  text-align: center;
  font-size: 13px;
  color: #c9b38a;
}
.avatar {
  flex: none;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  display: grid;
  place-items: center;
  font-family: "Noto Serif KR", serif;
  font-size: 44px;
  font-weight: 900;
  color: #fffaf0;
  background: linear-gradient(135deg, var(--ochre-500), var(--brown-500));
  box-shadow: var(--shadow-hover);
}

/* 맨 위로 버튼 */
.to-top {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 40;
  width: 50px;
  height: 50px;
  border: 0;
  border-radius: 50%;
  font-size: 22px;
  font-weight: 700;
  color: #fffaf0;
  cursor: pointer;
  background: linear-gradient(135deg, var(--ochre-500), var(--brown-500));
  box-shadow: var(--shadow-hover);
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  transition: opacity 0.25s, transform 0.25s, visibility 0.25s;
}
.to-top.show { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { transform: translateY(-3px); }

:focus-visible { outline: 3px solid var(--ochre-300); outline-offset: 3px; }

/* ===== 반응형 ===== */
@media (max-width: 960px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .hero-inner { grid-template-columns: 1fr; gap: 36px; }
  .slip { height: 300px; }
  .facts { grid-template-columns: repeat(2, 1fr); }
  .fact:nth-child(3) { border-left: 0; }
  .fact:nth-child(n + 3) { border-top: 1px dashed var(--line); }
  .slide { flex-basis: calc((100% - 20px) / 2); }
  .slider-btn.prev { left: -8px; }
  .slider-btn.next { right: -8px; }
  .footer-profile { grid-template-columns: auto 1fr; }
  .footer-contacts { grid-column: 1 / -1; }
  .cal-layout { grid-template-columns: 1fr; }
  .cal-detail { position: static; }
  .poll-layout { grid-template-columns: 1fr; }
  .qz-build { grid-template-columns: minmax(0, 1fr); overflow-y: auto; overflow-x: hidden; }
  .qz-build-main, .qz-build-side { overflow: visible; }
  .qz-build-side { border-left: 0; border-top: 1px solid var(--line); }
  .qz-lobby, .qz-reveal { grid-template-columns: 1fr; }
}

@media (max-width: 1100px) {
  .menu-toggle { display: flex; }
  .site-nav {
    position: absolute;
    top: var(--header-h);
    left: 12px;
    right: 12px;
    flex-direction: column;
    gap: 2px;
    padding: 10px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-hover);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
  }
  .menu-open .site-nav { opacity: 1; visibility: visible; transform: none; }
  .site-nav a { padding: 12px 16px; font-size: 16px; }
}

@media (max-width: 600px) {
  :root { --radius: 18px; --header-h: 60px; }
  .container, .header-inner { padding: 0 16px; }
  .hero { padding: 36px 0 28px; }
  .section { padding: 52px 0; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .goals ol { grid-template-columns: 1fr; }
  .slips-row { gap: 3px; padding: 0 8px; }

  .slip:nth-child(n + 8) { display: none; }
  .card { padding: 20px; }
  .quiz-layout { grid-template-columns: 1fr; }
  .qz-choices { gap: 10px; }
  .qz-choice { min-height: 96px; flex-direction: column; justify-content: center; text-align: center; gap: 6px; font-size: 16px; padding: 10px; }
  .qz-choices-host .qz-choice { min-height: 90px; font-size: 16px; }
  .qz-qchoices { grid-template-columns: 1fr; }
  .qz-qmeta { grid-template-columns: 1fr; }
  .qz-ai-row { grid-template-columns: 1fr 1fr; }
  .qz-ai-row label:last-child { grid-column: 1 / -1; }
  .qz-dist { min-height: 190px; gap: 6px; }
  .qz-dist-label { font-size: 12px; }
  .qz-bar .qz-pin-chip { display: none; }
  .qz-build-foot { padding: 10px 14px; }
  .qz-build-main { padding: 14px; }
  .ad-body { flex-direction: column; }
  .ad-tabs { width: auto; flex-direction: row; flex-wrap: wrap; overflow-x: visible; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; gap: 4px; }
  .ad-tabs button { flex: none; white-space: nowrap; min-height: 38px; }
  .ad-main { padding: 16px 14px 32px; }
  .ad-savebar { padding: 10px 14px; flex-wrap: wrap; }
  .ad-dirty { flex-basis: 100%; }
  .ad-cards { grid-template-columns: 1fr; }
  .ad-head { padding: 10px 14px; }
  .ed-row { flex-wrap: wrap; }
  .notice-item > summary { flex-wrap: wrap; }
  .notice-date { flex-basis: 100%; }
  .header-inner { gap: 8px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-actions .btn { width: 100%; justify-content: center; }
  .done-summary div { grid-template-columns: 1fr; gap: 0; }
  .class-head { flex-direction: column; align-items: flex-start; }
  .attend-list li { grid-template-columns: 44px 1fr auto; }
  .attend-list .check-in { grid-column: 3; }
  .toast { border-radius: 18px; bottom: 76px; }
  .week-item { padding-left: 14px; }
  .week-item::before { width: 14px; }
  .week-item > summary { padding: 16px 50px 16px 16px; gap: 10px; flex-wrap: wrap; }
  .week-sum { flex-basis: 100%; order: 3; }
  .week-body { padding: 16px; }
  .assignment-foot .btn { width: 100%; justify-content: center; }
  .cal { padding: 14px 10px; }
  .cal-grid { gap: 3px; }
  .cal-day { min-height: 52px; padding: 4px; border-radius: 8px; }

  .stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat { padding: 20px 10px; }
  .slide { flex-basis: 86%; }
  .slider-btn { display: none; }
  .footer-profile { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 20px; }
  .footer-contacts { width: 100%; text-align: left; }
  .to-top { right: 16px; bottom: 16px; width: 46px; height: 46px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}

/* =====================================================================
   디자인 테마 — 크림 + 짙은 초록, 부드러운 입체(뉴모피즘) 스타일
   색과 그림자는 아래 :root 값만 바꾸면 사이트 전체에 적용됩니다.
   ===================================================================== */
:root {
  --green-900: #163a31;
  --green-800: #1d4f45;
  --green-700: #1f5547;
  --green-500: #3b7a68;
  --green-200: #cfe0d6;
  --green-100: #e2ece5;
  --cream-50: #f6f2ea;
  --cream-100: #efe9df;
  --cream-200: #e7e0d3;
  --cream-300: #d9d0bf;

  /* 기존 이름의 색을 새 팔레트로 연결 */
  --brown-900: #1f2a26;
  --brown-700: var(--green-700);
  --brown-500: var(--green-500);
  --ochre-700: var(--green-700);
  --ochre-500: var(--green-500);
  --ochre-300: #a9c4b8;
  --yellow-200: var(--green-100);
  --yellow-100: #ebe5da;
  --bamboo-light: var(--cream-50);
  --bamboo-mid: var(--cream-100);
  --bamboo-dark: var(--cream-300);
  --ink: var(--green-800);
  --cord: #c9bfae;

  --bg: var(--cream-100);
  --surface: #f3eee5;
  --text: #24302c;
  --text-soft: #66706b;
  --accent: var(--green-700);
  --accent-2: var(--green-500);
  --line: rgba(255, 255, 255, 0.55);
  --grain: linear-gradient(transparent, transparent);

  --radius: 18px;
  --radius-sm: 12px;
  --raise: 6px 6px 14px rgba(166, 152, 128, 0.32), -6px -6px 14px rgba(255, 255, 255, 0.85);
  --raise-hover: 10px 10px 22px rgba(166, 152, 128, 0.38), -8px -8px 18px rgba(255, 255, 255, 0.9);
  --press: inset 3px 3px 7px rgba(166, 152, 128, 0.35), inset -3px -3px 7px rgba(255, 255, 255, 0.85);
  --shadow: var(--raise);
  --shadow-hover: var(--raise-hover);
}

body {
  background:
    radial-gradient(circle at 10% 0%, rgba(255, 255, 255, 0.7) 0, transparent 40%),
    radial-gradient(circle at 90% 30%, rgba(207, 224, 214, 0.35) 0, transparent 45%),
    var(--bg);
  color: var(--text);
}
a { color: var(--green-700); }
:focus-visible { outline: 3px solid var(--green-200); outline-offset: 3px; }

/* 헤더 */
.site-header { background: rgba(239, 233, 223, 0.9); }
.site-header.scrolled { box-shadow: 0 6px 18px rgba(166, 152, 128, 0.22); border-color: transparent; }
.brand-logo {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  color: var(--cream-50);
  font-size: 22px;
  background: var(--green-700);
  box-shadow: 4px 4px 10px rgba(29, 79, 69, 0.3), -3px -3px 8px rgba(255, 255, 255, 0.8);
}
.brand-text strong { color: var(--green-800); }
.site-nav a { color: var(--text-soft); border-radius: 10px; }
.site-nav a:hover { background: var(--surface); box-shadow: var(--raise); color: var(--green-800); }
.site-nav a.active { background: var(--surface); color: var(--green-700); box-shadow: var(--press); }
.admin-lock, .menu-toggle { background: var(--surface); border: 0; box-shadow: var(--raise); color: var(--green-700); }
.menu-toggle span { background: var(--green-700); }
.admin-lock.is-open { background: var(--green-700); color: var(--cream-50); }
@media (max-width: 1100px) {
  .site-nav { background: var(--surface); box-shadow: var(--raise-hover); }
}

/* 제목 · 글자 */
.hero h1, .section-title, .qz-big, .ad-title, .cal-title, .apply-done h3, .class-head h3, .modal-body h2 { color: var(--green-800); }
.hero-subtitle { color: var(--green-500); }
.section-title::after {
  width: 44px;
  height: 4px;
  border-radius: 4px;
  background: var(--green-700);
}
.section-lead { color: var(--text-soft); }
.section-tint { background: linear-gradient(180deg, rgba(231, 224, 211, 0.55), rgba(231, 224, 211, 0.25)); }

/* 카드: 바탕에서 살짝 떠 있는 모양 */
.card, .facts, .qz-join-box, .ad-card, .notice-form, .ed-group, .qz-qcard, .qz-reveal-box, .qz-top li, .qz-board li, .qz-chips li {
  background: var(--surface);
  border: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: var(--raise);
}
.ed-group .ed-group { background: var(--cream-50); }
.feature:hover, .week:hover, .tool:hover { box-shadow: var(--raise-hover); }
.feature-icon, .fact-icon {
  background: var(--surface);
  box-shadow: var(--press);
}
.stat strong, .stat-value, .rate strong, .poll-total, .grading-row strong { color: var(--green-700); }

/* 버튼: 짙은 초록 주 버튼 + 떠 있는 보조 버튼 */
.btn { border-radius: 12px; }
.btn-primary {
  color: #fff;
  background: var(--green-700);
  box-shadow: 4px 4px 12px rgba(29, 79, 69, 0.32), -4px -4px 10px rgba(255, 255, 255, 0.8);
}
.btn-primary:hover { background: var(--green-800); }
.btn-primary:active { box-shadow: inset 3px 3px 8px rgba(0, 0, 0, 0.25); transform: none; }
.btn-ghost, button.btn-ghost {
  color: var(--green-700);
  background: var(--surface);
  border: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: var(--raise);
}
.btn-ghost:active { box-shadow: var(--press); transform: none; }
.btn.is-disabled, .btn:disabled { background: var(--cream-200); color: #9a9a90; box-shadow: none; opacity: 1; }
.btn.danger { color: #a3412f; }
.badge { background: var(--surface); color: var(--green-700); border: 0; box-shadow: var(--raise); font-weight: 700; }

/* 입력창: 안으로 눌린 모양 */
.field input:not([type="radio"]):not([type="checkbox"]), .field select, .field textarea,
.ed-field input, .ed-field textarea, .ad-inline input, .notice-form textarea, .ad-select select,
.qz-sets select, .qz-qmeta select, .qz-ai select, .qz-ai .ed-field input, .qz-paste textarea, .qz-pass {
  background: var(--cream-100);
  border: 1px solid transparent;
  box-shadow: var(--press);
}
.field input:focus, .field select:focus, .field textarea:focus, .ed-field input:focus, .ed-field textarea:focus, .ad-inline input:focus {
  border-color: var(--green-500);
  box-shadow: var(--press), 0 0 0 3px rgba(59, 122, 104, 0.18);
}
.has-error input:not([type="radio"]):not([type="checkbox"]), .has-error select, .has-error textarea { border-color: #b4483c; background: #f7ece6; }
.choice input, .ed-check input, .poll-option input, .materials input { accent-color: var(--green-700); }
.poll-option { background: var(--surface); border: 1px solid transparent; box-shadow: var(--raise); }
.poll-option:has(input:checked) { box-shadow: var(--press); border-color: var(--green-500); background: var(--surface); }

/* 태그 · 칩 · 막대 */
.tag-req, .tag-hw, .tag-exam, .week-exam .week-num { color: #fff; background: var(--green-700); }
.tag-opt, .chip-wait, .week-num { color: var(--green-700); background: var(--green-100); }
.chip-ok { background: var(--green-500); }
.tag-new { background: #b4483c; }
.bar { background: var(--cream-100); box-shadow: var(--press); }
.bar span, .poll-bar.is-top .bar span { background: linear-gradient(90deg, var(--green-500), var(--green-700)); }
.slider-dots button::before { background: var(--cream-300); }
.slider-dots button.active::before { background: var(--green-700); }
.slider-btn { background: var(--surface); border: 0; box-shadow: var(--raise); color: var(--green-700); }
.goals li::before { background: var(--green-700); }
.notes li::marker, .week-content li::marker, .modal-points li::marker { color: var(--green-500); }

/* 첫 화면 죽간: 크림색 입체 판 + 초록 글씨 */
.slip {
  color: var(--green-800);
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--raise);
}
.slips-row::before, .slips-row::after { background: linear-gradient(90deg, transparent, var(--cream-300) 6%, var(--cream-300) 94%, transparent); box-shadow: none; height: 3px; }
.facts { border-radius: var(--radius); }
.fact + .fact { border-left-color: var(--cream-300); }

/* 커리큘럼 · 달력 */
.week-item { padding-left: 6px; }
.week-item::before { width: 6px; background: var(--green-700); }
.week-exam { background: var(--surface); }
.week-exam::before { background: var(--green-500); }
.week-meta div { background: var(--surface); box-shadow: var(--press); }
.video-links a { background: var(--surface); border: 0; box-shadow: var(--raise); }
.assignment { background: var(--surface); border: 1px solid var(--green-200); box-shadow: var(--press); }
.countdown.is-open { color: var(--green-700); background: var(--green-100); }
.cal-day { background: transparent; }
.cal-day:hover { box-shadow: var(--raise); border-color: transparent; }
.cal-day.is-class { background: var(--green-100); box-shadow: var(--raise); }
.cal-day.is-exam .cal-tag, .cal-tag { background: var(--green-700); }
.cal-day.is-selected { box-shadow: var(--press); border-color: var(--green-500); }
.cal-day.is-today .cal-num { background: var(--green-800); }
.lg-class { background: var(--green-100); }
.cal-nav { background: var(--surface); border: 0; box-shadow: var(--raise); color: var(--green-700); }
.detail-date { color: var(--green-500); }
.today-box { background: var(--surface); border: 1px dashed var(--green-200); }
.today-box.is-done { background: var(--green-100); color: var(--green-700); border-color: var(--green-200); }
.sub-item { background: var(--surface); box-shadow: var(--raise); border: 0; }
.error-summary { background: #f7ece6; border-color: #e3b7a8; }

/* 공지 · FAQ · 모달 */
.faq-item summary::after, .week-item > summary::after { background: var(--surface); color: var(--green-700); box-shadow: var(--raise); }
.notice-item.is-pinned { border-color: var(--green-200); }
.modal { background: var(--surface); }
.modal::before { background: var(--green-700); height: 6px; }
.modal-close { background: var(--surface); box-shadow: var(--raise); color: var(--green-700); }
.modal-foot button { background: var(--cream-100); color: var(--green-700); }
.modal-foot button:hover { background: var(--green-100); }
.toast { background: var(--green-800); }
.to-top { background: var(--green-700); box-shadow: 4px 4px 12px rgba(29, 79, 69, 0.32), -4px -4px 10px rgba(255, 255, 255, 0.8); }
.done-mark { background: var(--green-700); }
.done-summary { background: var(--cream-100); box-shadow: var(--press); }
.avatar { background: var(--green-700); }

/* 푸터 · 관리자 · 퀴즈 상단 막대: 짙은 초록 */
.site-footer { background: linear-gradient(180deg, var(--green-800), var(--green-900)); color: #e6efe9; }
.site-footer h2 { color: #fff; }
.site-footer h2 small, .profile-bio, .footer-bottom { color: #c4d6cc; }
.footer-bottom p { margin: 0; line-height: 1.8; }
.notice-form.is-editing { outline: 2px solid var(--green-500); }
.notice-options { display: flex; flex-wrap: wrap; gap: 6px 20px; }
.ai-keys { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--raise); }
.ai-keys-title { margin: 0; font-weight: 700; color: var(--green-800); }
.ai-provider { display: grid; gap: 4px; }
.ai-provider small { font-weight: 500; }
.key-ok { color: var(--green-500); }
.key-none { color: #a3412f; }
.baze-key-box { display: grid; gap: 8px; }
.baze-key-box[hidden] { display: none; }
.key-status { margin: 0 0 12px; display: grid; gap: 6px; }
.key-status div { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.key-status dt { color: var(--text-soft); }
.key-status dd { margin: 0; }
.ad-card code { font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--cream-200); overflow-wrap: anywhere; }
.baze-docs { align-self: center; font-size: 13px; color: var(--green-700); }
.popup-notices { display: grid; gap: 12px; max-height: 50vh; overflow-y: auto; margin-bottom: 16px; }
.popup-notice { padding: 12px 14px; border-radius: 12px; background: var(--cream-100); box-shadow: var(--press); }
.popup-notice h3 { margin: 0 0 2px; font-size: 16px; color: var(--green-800); }
.popup-notice p { margin: 0; }
.popup-notice .popup-notice-date { font-size: 12px; color: var(--text-soft); margin-bottom: 6px; }
.notice-editing { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--green-100); color: var(--green-800); font-size: 14px; }
.roster-check, .roster-check-all { width: 18px; height: 18px; accent-color: var(--green-700); }
.site-footer .name-alt { font-family: "Noto Sans KR", "Noto Sans SC", sans-serif; font-size: 15px; font-weight: 500; color: #c4d6cc; }
.profile-aff-en { display: block; font-size: 13px; font-weight: 400; color: #c4d6cc; font-style: italic; }
.profile-roles { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.profile-roles li { padding: 3px 12px; border-radius: 999px; font-size: 13px; color: #e6efe9; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18); }
.site-footer img.avatar { display: block; object-fit: cover; border: 3px solid rgba(255, 255, 255, 0.85); }
@media (max-width: 600px) { .profile-roles { justify-content: center; } }
.footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 4px; }
.footer-links a { color: #fff; font-weight: 700; text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, 0.4); }
.footer-links a:hover { border-bottom-color: #fff; }
@media (max-width: 600px) { .footer-sep { display: none; } .footer-links { flex-direction: column; gap: 2px; } }
.footer-eyebrow, .site-footer .profile-aff, .footer-contacts dt { color: #a9d1c0; }
.ad-head, .qz .qz-bar { background: linear-gradient(180deg, var(--green-700), var(--green-800)); }
.ad-site, .qz-me { color: #a9d1c0; }
.ad-tabs { background: var(--cream-200); }
.ad-tabs button.active { background: var(--green-700); color: #fff; }
.ad-help { background: var(--green-100); }
.ad-table th { background: var(--cream-200); color: var(--green-800); }
.ad-table tbody tr:hover { background: var(--green-100); }
.ed-item { background: var(--cream-50); border-color: var(--cream-300); }
.ed-item-head strong, .qz-qcard-head strong { background: var(--green-700); }
.ed-tools button, .ed-add { background: var(--surface); border: 0; box-shadow: var(--raise); color: var(--green-700); }
.ed-tools button[data-op="del"] { color: #a3412f; }
.qz { background: var(--bg); }
.qz-build-side { background: var(--cream-200); }
.qz-q-head > .qz-timer { background: var(--green-700); }
.qz-timebar { background: var(--cream-200); box-shadow: var(--press); }
.qz-timebar span { background: linear-gradient(90deg, var(--green-500), var(--green-700)); }
.qz-board-rank, .qz-name, .qz-rank b { color: var(--green-700); }
.qz-dots i { background: var(--green-500); }
.qz-paste { background: var(--surface); }
.nav-badge { background: #b4483c; }

.done-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

/* 제목 앞 이모지 */
.title-emoji {
  display: inline-block;
  margin-right: 10px;
  font-size: 0.85em;
  vertical-align: 0.05em;
  animation: titleSway 3s ease-in-out infinite;
  transform-origin: 50% 0;
}
@keyframes titleSway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { .title-emoji { animation: none; } }

/* 헤더 사이트 이름 오른쪽 버전 표시 */
.brand-text strong { display: flex; align-items: baseline; gap: 6px; }
.brand-version { margin-left: 0 !important; font-size: 11px !important; vertical-align: baseline !important; }
.brand-version:empty { display: none; }
.version-tag {
  display: inline-block;
