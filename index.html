          '<div class="ad-actions"><button class="btn btn-primary btn-sm" type="button" data-action="goto-apikeys">API 키 설정 열기</button></div></div>'
        );
      })() +
      '<div class="ad-card"><h4>원래대로 되돌리기</h4>' +
      "<p>이 브라우저에 저장된 수정 내용을 지우고 index.html에 들어 있는 원래 설정으로 돌아갑니다. (명단·공지·기록은 그대로)</p>" +
      '<div class="ad-actions"><button class="btn btn-ghost btn-sm danger" type="button" data-action="reset-config"' + (S.hasSavedConfig() ? "" : " disabled") + ">원래대로</button></div></div>" +
      '<div class="ad-card"><h4>관리자 비밀번호 바꾸기</h4>' +
      '<form class="pw-form" novalidate>' +
      '<label class="ed-field"><span>새 비밀번호 (8자 이상)</span><input type="password" name="pw1" autocomplete="new-password" /></label>' +
      '<label class="ed-field"><span>새 비밀번호 확인</span><input type="password" name="pw2" autocomplete="new-password" /></label>' +
      '<button class="btn btn-primary btn-sm" type="submit">비밀번호 바꾸기</button>' +
      '<p class="form-msg pw-msg" aria-live="polite"></p></form>' +
      '<p class="ad-help small">바꾼 비밀번호는 해시값으로만 저장됩니다. 다른 컴퓨터에서도 쓰려면 index.html을 내보내 교체하세요.</p></div>' +
      "</div>" +
      '<p class="form-msg settings-msg" aria-live="polite"></p>'
    );
  }
  function tableHTML(head, rows, emptyText, cls) {
    if (!rows.length) return '<p class="ad-empty">' + esc(emptyText) + "</p>";
    return (
      '<div class="ad-table-wrap"><table class="ad-table ' + (cls || "") + '"><thead><tr>' +
      list(head, function (h) { return "<th>" + (h && h.html ? h.html : esc(h)) + "</th>"; }) +
      "</tr></thead><tbody>" +
      list(rows, function (r) { return "<tr>" + list(r, function (c) { return "<td>" + c + "</td>"; }) + "</tr>"; }) +
      "</tbody></table></div>"
    );
  }

  /* ---------- 관리자 화면 그리기 ---------- */
  function renderTab(keepScroll) {
    var main = root.querySelector(".ad-main");
    var y = main.scrollTop;
    var tab = TABS.filter(function (t) { return t.id === currentTab; })[0] || TABS[0];
    var html = {
      site: tabSite, sections: tabSections, roster: tabRoster, notices: tabNotices, attendance: tabAttendance,
      submissions: tabSubmissions, applications: tabApplications, apikeys: tabApiKeys, settings: tabSettings,
    }[tab.id]();
    main.innerHTML = "<h3 class=\"ad-title\">" + esc(tab.label) + "</h3>" + html;
    root.querySelectorAll(".ad-tabs button").forEach(function (b) {
      var on = b.getAttribute("data-tab") === tab.id;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", String(on));
      /* 휴대폰에서 가로로 늘어선 탭 중 선택한 탭이 보이도록 */
      if (on) {
        var bar = b.parentNode;
        if (bar.scrollWidth > bar.clientWidth) bar.scrollLeft = b.offsetLeft - (bar.clientWidth - b.offsetWidth) / 2;
      }
    });
    root.querySelector(".ad-savebar").hidden = !tab.edit;
    updateDirty();
    main.scrollTop = keepScroll ? y : 0;
  }
  function updateDirty() {
    var bar = root && root.querySelector(".ad-savebar");
    if (!bar) return;
    bar.classList.toggle("is-dirty", dirty);
    bar.querySelector(".ad-dirty").textContent = dirty ? "저장하지 않은 변경이 있습니다." : "변경 사항 없음";
  }
  function flash(sel, text, type) {
    var el = root.querySelector(sel);
    if (!el) return;
    el.textContent = text;
    el.className = el.className.replace(/\bis-(ok|error)\b/g, "").trim() + (type ? " is-" + type : "");
  }

  function openPanel() {
    if (root) return;
    root = document.createElement("div");
    root.className = "admin";
    root.setAttribute("role", "dialog");
    root.setAttribute("aria-modal", "true");
    root.setAttribute("aria-label", "관리자 화면");
    root.innerHTML =
      '<header class="ad-head"><strong>관리자 화면</strong><span class="ad-site">' + esc(C.site.title) + "</span>" +
      '<span class="ad-head-actions"><button class="btn btn-ghost btn-sm" type="button" data-action="close">사이트 보기</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-action="logout">로그아웃</button></span></header>' +
      '<div class="ad-body">' +
      '<nav class="ad-tabs" role="tablist" aria-label="관리 메뉴">' +
      list(TABS, function (t) { return '<button type="button" role="tab" data-tab="' + t.id + '">' + esc(t.label) + "</button>"; }) +
      "</nav>" +
      '<div class="ad-content"><div class="ad-main"></div>' +
      '<div class="ad-savebar" hidden><span class="ad-dirty"></span>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-action="discard">변경 취소</button>' +
      '<button class="btn btn-primary btn-sm" type="button" data-action="save">저장하고 적용</button></div>' +
      "</div></div>";
    document.body.appendChild(root);
    document.body.classList.add("admin-open");
    bindPanel();
    renderTab();
    var msg = session(FLASH_KEY);
    if (msg) {
      session(FLASH_KEY, null);
      var main = root.querySelector(".ad-main");
      main.insertAdjacentHTML("afterbegin", '<p class="ad-flash" role="status">' + esc(msg) + "</p>");
    }
    root.querySelector(".ad-tabs .active").focus();
    updateLockIcon();
  }
  function closePanel() {
    if (!root) return;
    if (dirty && !confirm("저장하지 않은 변경이 있습니다. 닫을까요?")) return;
    dirty = false;
    draft = clone(C);
    root.remove();
    root = null;
    document.body.classList.remove("admin-open");
    document.querySelector(".admin-lock").focus();
  }
  /* v1.2.3 → v1.2.4 (형식이 다르면 그대로 둠) */
  function bumpVersion(v) {
    var m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(String(v || "").trim());
    return m ? "v" + m[1] + "." + m[2] + "." + (Number(m[3]) + 1) : v;
  }
  function saveAndApply(message) {
    var cfg = prune(clone(draft));
    if (cfg.site && cfg.site.version) {
      var before = cfg.site.version;
      cfg.site.version = bumpVersion(before);
      if (cfg.site.version !== before) message = (message || "저장했습니다. 사이트에 적용되었습니다.") + " (버전 " + before + " → " + cfg.site.version + ")";
    }
    if (!S.saveConfig(cfg)) {
      alert("이 브라우저에 저장할 수 없습니다. 개인정보 보호 모드인지 확인해 주세요.");
      return;
    }
    dirty = false;
    session(TAB_KEY, currentTab);
    session(FLASH_KEY, message || "저장했습니다. 사이트에 적용되었습니다.");
    location.reload();
  }

  function bindPanel() {
    root.addEventListener("click", function (e) {
      var tabBtn = e.target.closest(".ad-tabs button");
      if (tabBtn) {
        currentTab = tabBtn.getAttribute("data-tab");
        session(TAB_KEY, currentTab);
        renderTab();
        return;
      }
      var op = e.target.closest("[data-op]");
      if (op) return arrayOp(op);
      var act = e.target.closest("[data-action]");
      if (act) return action(act.getAttribute("data-action"), act);
    });
    root.addEventListener("input", onEdit);
    root.addEventListener("change", function (e) {
      if (e.target.classList.contains("section-pick")) {
        currentSection = e.target.value;
        renderTab();
        return;
      }
      if (e.target.name === "admin-ai-provider") {
        S.prefSet("aiProvider", e.target.value);
        return flash(".apikey-msg", "기본 AI 키를 " + (e.target.value === "baze" ? "BAZE API 키" : "Claude API 키") + "로 정했습니다.", "ok");
      }
      if (e.target.classList.contains("apikey-show")) {
        root.querySelector(".apikey-form [name=bazeKey]").type = e.target.checked ? "text" : "password";
        return;
      }
      if (e.target.classList.contains("roster-check-all")) {
        root.querySelectorAll(".roster-check").forEach(function (c) { c.checked = e.target.checked; });
        return;
      }
      if (e.target.classList.contains("roster-csv")) return importRosterCSV(e.target);
      if (e.target.classList.contains("import-json")) return importJSON(e.target);
      onEdit(e);
    });
    root.addEventListener("submit", function (e) {
      e.preventDefault();
      if (e.target.classList.contains("roster-form")) addRosterFromForm(e.target);
      if (e.target.classList.contains("notice-form")) addNotice(e.target);
      if (e.target.classList.contains("pw-form")) changePassword(e.target);
      if (e.target.classList.contains("apikey-form")) {
        var key = e.target.elements.bazeKey.value.trim();
        if (!key) return flash(".apikey-msg", "BAZE API 키를 입력해 주세요.", "error");
        S.prefSet("bazeKey", key);
        S.prefSet("aiProvider", "baze");
        renderTab(true);
        return flash(".apikey-msg", "BAZE API 키를 저장하고 기본 AI 키로 정했습니다. 「연결 확인」으로 키가 맞는지 확인해 보세요.", "ok");
      }
    });
    root.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closePanel();
    });
  }

  function onEdit(e) {
    var el = e.target;
    var path = el.getAttribute && el.getAttribute("data-path");
    if (!path) return;
    var type = el.getAttribute("data-type");
    var v = type === "boolean" ? el.checked : type === "number" ? (el.value === "" ? 0 : Number(el.value)) : el.value;
    setPath(draft, path, v);
    dirty = true;
    updateDirty();
  }
  function arrayOp(btn) {
    var path = btn.getAttribute("data-path");
    var i = Number(btn.getAttribute("data-i"));
    var arr = getPath(draft, path);
    if (!Array.isArray(arr)) {
      arr = [];
      setPath(draft, path, arr);
    }
    var op = btn.getAttribute("data-op");
    if (op === "add") {
      var t = templateFor(path, arr);
      arr.push(t && typeof t === "object" ? JSON.parse(JSON.stringify(blank(t))) : "");
    } else if (op === "del") {
      if (!confirm((i + 1) + "번 항목을 삭제할까요?")) return;
      arr.splice(i, 1);
    } else if (op === "up" && i > 0) {
      arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
    } else if (op === "down" && i < arr.length - 1) {
      arr.splice(i + 1, 0, arr.splice(i, 1)[0]);
    }
    dirty = true;
    renderTab(true);
  }

  /* ---------- 명단 ---------- */
  function upsertRoster(entries) {
    var roster = S.getRoster();
    var added = 0;
    var updated = 0;
    entries.forEach(function (s) {
      var idx = roster.findIndex(function (r) { return r.id === s.id; });
      if (idx >= 0) {
        roster[idx] = Object.assign({}, roster[idx], s);
        updated++;
      } else {
        roster.push(s);
        added++;
      }
    });
    roster.sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    S.saveRoster(roster);
    return { added: added, updated: updated };
  }
  function addRosterFromForm(form) {
    var s = {
      id: form.elements.id.value.trim(),
      name: form.elements.name.value.trim(),
      major: form.elements.major.value.trim(),
      email: form.elements.email.value.trim(),
    };
    if (!/^\d{10}$/.test(s.id)) return flash(".roster-msg", "학번은 숫자 10자리로 입력해 주세요.", "error");
    if (!s.name) return flash(".roster-msg", "이름을 입력해 주세요.", "error");
    var r = upsertRoster([s]);
    renderTab(true);
    flash(".roster-msg", r.added ? s.name + " 학생을 추가했습니다." : s.name + " 학생 정보를 고쳤습니다.", "ok");
    root.querySelector(".roster-form input").focus();
  }
  function importRosterCSV(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCSV(String(reader.result));
      var entries = [];
      var skipped = 0;
      rows.forEach(function (r) {
        var id = (r[0] || "").trim().replace(/^'/, "");
        if (!/^\d{10}$/.test(id)) { skipped++; return; }
        entries.push({ id: id, name: (r[1] || "").trim(), major: (r[2] || "").trim(), email: (r[3] || "").trim() });
      });
      var res = upsertRoster(entries);
      renderTab(true);
      flash(".roster-msg", "추가 " + res.added + "명, 수정 " + res.updated + "명" + (skipped ? ", 건너뜀 " + skipped + "줄 (제목 줄 또는 학번 형식 오류)" : ""), "ok");
    };
    reader.readAsText(file, "utf-8");
  }
  function appToEntry(r) {
    return { id: r.data.studentId, name: r.data.name, major: r.data.major || "", email: r.data.email || "" };
  }

  /* ---------- 공지 ---------- */
  function addNotice(form) {
    var title = form.elements.title.value.trim();
    var body = form.elements.body.value.trim();
    if (!title || !body) return flash(".notice-msg", !title ? "제목을 입력해 주세요." : "내용을 입력해 주세요.", "error");
    var items = S.getNotices();
    var pinned = form.elements.pinned.checked;
    var popup = form.elements.popup.checked;
    if (editingNotice) {
      items = items.map(function (n) {
        if (n.id === editingNotice) {
          n.title = title;
          n.body = body;
          n.pinned = pinned;
          n.popup = popup;
          n.editedAt = new Date().toISOString();
        }
        return n;
      });
      editingNotice = null;
      S.saveNotices(items);
      renderTab(true);
      return flash(".notice-msg", "공지를 수정했습니다.", "ok");
    }
    items.push({ id: "n" + Date.now().toString(36), title: title, body: body, pinned: pinned, popup: popup, at: new Date().toISOString() });
    S.saveNotices(items);
    renderTab();
    flash(".notice-msg", "공지를 올렸습니다. 사이트 공지사항과 메뉴에 NEW로 표시됩니다.", "ok");
  }

  /* ---------- 설정 파일 ---------- */
  function exportJSON() {
    var data = {
      kind: "kc2-site-settings",
      version: 1,
      savedAt: new Date().toISOString(),
      config: prune(clone(draft)),
      roster: S.getRoster(),
      notices: S.getNotices(),
    };
    download("교양중국어2_설정_" + stamp() + ".json", JSON.stringify(data, null, 2), "application/json");
  }
  function importJSON(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (err) {
        return flash(".settings-msg", "설정 파일을 읽을 수 없습니다. JSON 형식이 아닙니다.", "error");
      }
      if (!data || data.kind !== "kc2-site-settings" || !data.config || !data.config.site || !data.config.curriculum) {
        return flash(".settings-msg", "이 사이트의 설정 파일이 아닙니다.", "error");
      }
      if (!confirm("설정 파일(" + fmtTime(data.savedAt) + " 저장)을 불러올까요? 지금 사이트 내용과 명단·공지가 파일 내용으로 바뀝니다.")) return;
      if (Array.isArray(data.roster)) S.saveRoster(data.roster);
      if (Array.isArray(data.notices)) S.saveNotices(data.notices);
      draft = data.config;
      saveAndApply("설정 파일을 불러와 적용했습니다.");
    };
    reader.readAsText(file, "utf-8");
  }
  /* 지금 설정을 넣은 index.html을 새로 만들어 내려받기
     (index.html 안의 CONFIG-START ~ CONFIG-END 사이만 바꿉니다) */
  /* 관리자 화면의 공지를 설정에 담아 모든 방문자가 보게 함 */
  function withNotices(cfg) {
    cfg.noticeList = S.getNotices();
    return cfg;
  }
  function exportIndexHTML() {
    var block =
      "/* CONFIG-START */\n" +
      "/* 관리자 화면에서 " + fmtTime(new Date().toISOString()) + "에 내보낸 설정 */\n" +
      "window.SITE_CONFIG = " + JSON.stringify(withNotices(prune(clone(draft))), null, 2) + ";\n" +
      "/* CONFIG-END */";
    fetch(location.pathname, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(function (html) {
        var start = html.indexOf("/* CONFIG-START */");
        var end = html.indexOf("/* CONFIG-END */");
        if (start < 0 || end < 0) throw new Error("marker");
        var out = html.slice(0, start) + block.replace(/<\/script/gi, "<\\/script") + html.slice(end + "/* CONFIG-END */".length);
        download("index.html", out, "text/html");
        flash(".settings-msg", "새 index.html을 내려받았습니다. 사이트 폴더의 index.html을 이 파일로 바꾼 뒤 다시 배포하세요.", "ok");
      })
      .catch(function () {
        /* 파일을 더블클릭해 연 경우(file://)에는 원본을 읽을 수 없어 설정 부분만 내려받습니다 */
        download("설정_" + stamp() + ".txt", block, "text/plain");
        flash(
          ".settings-msg",
          "지금은 파일을 직접 열어 index.html 원본을 읽을 수 없습니다. 내려받은 글을 index.html의 /* CONFIG-START */부터 /* CONFIG-END */까지와 바꿔 넣거나, server.py로 사이트를 연 뒤 다시 시도하세요.",
          "error"
        );
      });
  }
  function changePassword(form) {
    var a = form.elements.pw1.value;
    var b = form.elements.pw2.value;
    if (a.length < 8) return flash(".pw-msg", "비밀번호는 8자 이상으로 정해 주세요.", "error");
    if (a !== b) return flash(".pw-msg", "두 비밀번호가 서로 다릅니다.", "error");
    sha256(draft.admin.salt + a).then(function (hash) {
      draft.admin.passwordHash = hash;
      saveAndApply("관리자 비밀번호를 바꿨습니다.");
    });
  }

  function action(name, btn) {
    switch (name) {
      case "close": return closePanel();
      case "logout":
        session(SESSION_KEY, null);
        dirty = false;
        closePanel();
        return updateLockIcon();
      case "save": return saveAndApply();
      case "discard":
        draft = clone(C);
        dirty = false;
        return renderTab(true);
      case "roster-del-selected": {
        var picked = Array.prototype.map.call(root.querySelectorAll(".roster-check:checked"), function (c) { return Number(c.getAttribute("data-i")); });
        if (!picked.length) return flash(".roster-msg", "삭제할 학생을 먼저 체크해 주세요.", "error");
        if (!confirm("선택한 " + picked.length + "명을 명단에서 뺄까요?")) return;
        S.saveRoster(S.getRoster().filter(function (_, i) { return picked.indexOf(i) < 0; }));
        renderTab(true);
        return flash(".roster-msg", picked.length + "명을 명단에서 뺐습니다.", "ok");
      }
      case "roster-clear": {
        var total = S.getRoster().length;
        if (!confirm("수강생 명단 " + total + "명을 모두 삭제할까요? 되돌릴 수 없습니다. (회원 계정·출석·과제 기록은 그대로 남습니다)")) return;
        S.saveRoster([]);
        renderTab(true);
        return flash(".roster-msg", "명단을 모두 삭제했습니다. 이제 가입한 회원은 누구나 로그인할 수 있습니다.", "ok");
      }
      case "roster-del": {
        var roster = S.getRoster();
        var s = roster[Number(btn.getAttribute("data-i"))];
        if (s && confirm(s.name + " (" + s.id + ") 학생을 명단에서 뺄까요?")) {
          roster.splice(Number(btn.getAttribute("data-i")), 1);
          S.saveRoster(roster);
          renderTab(true);
        }
        return;
      }
      case "roster-from-apps": {
        var apps = S.listApplications().filter(function (r) { return r.data && /^\d{10}$/.test(r.data.studentId || ""); });
        if (!apps.length) return flash(currentTab === "roster" ? ".roster-msg" : ".app-msg", "추가할 회원이 없습니다.", "error");
        var res = upsertRoster(apps.map(appToEntry));
        renderTab(true);
        return flash(currentTab === "roster" ? ".roster-msg" : ".app-msg", "명단에 추가 " + res.added + "명, 수정 " + res.updated + "명", "ok");
      }
      case "app-to-roster": {
        var r = S.listApplications()[Number(btn.getAttribute("data-i"))];
        var res1 = upsertRoster([appToEntry(r)]);
        renderTab(true);
        return flash(".app-msg", r.data.name + " 학생을 명단에 " + (res1.added ? "추가" : "갱신") + "했습니다.", "ok");
      }
      case "roster-download":
        return download(
          "수강생명단_" + stamp() + ".csv",
          toCSV([["학번", "이름", "학과", "이메일"]].concat(S.getRoster().map(function (s) { return [s.id, s.name, s.major, s.email]; }))),
          "text/csv;charset=utf-8"
        );
      case "csv-attendance":
        return download(
          "출석현황_" + stamp() + ".csv",
          toCSV([["학번", "이름"].concat(weeks.map(function (w) { return w.week + "주차 (" + U.fmtDate(w._date) + ")"; })).concat(["출석 수", "출석률"])].concat(attendanceRows(true))),
          "text/csv;charset=utf-8"
        );
      case "csv-submissions":
        return download(
          "과제제출_" + stamp() + ".csv",
          toCSV([["학번", "이름"].concat(assignmentWeeks.map(function (w) { return w.week + "주차 " + w.assignment.title; })).concat(["제출 수"])].concat(submissionRows(true))),
          "text/csv;charset=utf-8"
        );
      case "csv-applications":
        return download(
          "회원목록_" + stamp() + ".csv",
          toCSV([["회원번호", "가입 일시"].concat(appFields().map(function (f) { return f.label; }))].concat(applicationRows(true))),
          "text/csv;charset=utf-8"
        );
      case "notice-del": {
        var id = btn.getAttribute("data-id");
        if (!confirm("이 공지를 삭제할까요?")) return;
        if (editingNotice === id) editingNotice = null;
        S.saveNotices(S.getNotices().filter(function (n) { return n.id !== id; }));
        return renderTab(true);
      }
      case "notice-pin": {
        var nid = btn.getAttribute("data-id");
        var nowPinned = false;
        S.saveNotices(S.getNotices().map(function (n) { if (n.id === nid) { n.pinned = !n.pinned; nowPinned = n.pinned; } return n; }));
        renderTab(true);
        return flash(".notice-msg", nowPinned ? "📌 공지를 맨 위에 고정했습니다." : "고정을 해제했습니다.", "ok");
      }
      case "notice-popup": {
        var pid = btn.getAttribute("data-id");
        var nowPopup = false;
        S.saveNotices(S.getNotices().map(function (n) { if (n.id === pid) { n.popup = !n.popup; nowPopup = n.popup; } return n; }));
        renderTab(true);
        return flash(".notice-msg", nowPopup ? "🔔 이 공지를 사이트 팝업으로 띄웁니다." : "팝업을 껐습니다.", "ok");
      }
      case "notice-edit":
        editingNotice = btn.getAttribute("data-id");
        renderTab();
        return root.querySelector(".notice-form [name=title]").focus();
      case "notice-cancel":
        editingNotice = null;
        return renderTab(true);
      case "goto-apikeys":
        currentTab = "apikeys";
        session(TAB_KEY, currentTab);
        return renderTab();
      case "apikey-refresh":
        serverHealth = null;
        return renderTab(true);
      case "apikey-clear":
        if (!confirm("이 브라우저에 저장된 BAZE API 키를 지울까요?")) return;
        S.prefSet("bazeKey", "");
        if (S.prefGet("aiProvider", "") === "baze") S.prefSet("aiProvider", "claude");
        renderTab(true);
        return flash(".apikey-msg", "BAZE API 키를 지웠습니다.", "ok");
      case "apikey-check-baze": return checkKey("baze");
      case "apikey-check-claude": return checkKey("claude");
      case "export-json": return exportJSON();
      case "export-index": return exportIndexHTML();
      case "reset-config":
        if (!confirm("이 브라우저에 저장된 사이트 수정 내용을 지우고 index.html의 원래 설정으로 돌아갈까요?")) return;
        S.clearConfig();
        session(TAB_KEY, "settings");
        session(FLASH_KEY, "index.html의 원래 설정으로 되돌렸습니다.");
        return location.reload();
    }
  }

  /* 다른 탭에서 기록이 바뀌면 표 새로 그리기 */
  S.onChange(function (topic) {
    if (!root) return;
    var map = { attendance: "attendance", submissions: "submissions", applications: "applications", roster: "roster", notices: "notices" };
    if (map[topic] === currentTab) renderTab(true);
  });

  /* ---------- 자물쇠 버튼 · 비밀번호 확인 ---------- */
  var lockBtn = document.querySelector(".admin-lock");
  function isAdmin() { return session(SESSION_KEY) === "1"; }
  function updateLockIcon() {
    if (!lockBtn) return;
    lockBtn.classList.toggle("is-open", isAdmin());
    lockBtn.setAttribute("aria-label", isAdmin() ? "관리자 화면 열기 (로그인됨)" : "관리자 로그인");
  }

  var fails = 0;
  var lockedUntil = 0;
  var afterLogin = null; // 다른 기능(실시간 퀴즈 등)이 로그인 뒤에 할 일
  function openLogin() {
    if (document.querySelector(".admin-login")) return;
    var lastFocus = document.activeElement;
    var wrap = document.createElement("div");
    wrap.className = "modal-backdrop admin-login";
    wrap.innerHTML =
      '<form class="modal" role="dialog" aria-modal="true" aria-labelledby="admin-login-title" novalidate>' +
      '<button class="modal-close" type="button" aria-label="닫기">×</button>' +
      '<div class="modal-body">' +
      '<h2 id="admin-login-title">관리자 로그인</h2>' +
      '<label class="ed-field"><span>비밀번호</span><input type="password" name="pw" autocomplete="current-password" /></label>' +
      '<p class="form-msg" aria-live="polite"></p>' +
      '<button class="btn btn-primary modal-cta" type="submit">확인</button>' +
      "</div></form>";
    document.body.appendChild(wrap);
    requestAnimationFrame(function () { wrap.classList.add("show"); });
    var form = wrap.querySelector("form");
    var input = form.elements.pw;
    var msg = form.querySelector(".form-msg");
    input.focus();

    function close() {
      wrap.classList.remove("show");
      setTimeout(function () { wrap.remove(); }, 250);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    function cancel() {
      afterLogin = null;
      close();
    }
    wrap.addEventListener("click", function (e) {
      if (e.target === wrap || e.target.closest(".modal-close")) cancel();
    });
    wrap.addEventListener("keydown", function (e) {
      if (e.key === "Escape") cancel();
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (Date.now() < lockedUntil) {
        msg.textContent = "여러 번 틀려 잠시 잠겼습니다. " + Math.ceil((lockedUntil - Date.now()) / 1000) + "초 뒤에 다시 시도해 주세요.";
        msg.className = "form-msg is-error";
        return;
      }
      if (!input.value) {
        msg.textContent = "비밀번호를 입력해 주세요.";
        msg.className = "form-msg is-error";
        return;
      }
      sha256(C.admin.salt + input.value).then(function (hash) {
        if (hash === C.admin.passwordHash) {
          fails = 0;
          session(SESSION_KEY, "1");
          close();
          updateLockIcon();
          if (afterLogin) {
            var next = afterLogin;
            afterLogin = null;
            next();
          } else openPanel();
        } else {
          fails++;
          if (fails >= 5) {
            lockedUntil = Date.now() + 30000;
            fails = 0;
          }
          input.value = "";
          input.focus();
          msg.textContent = "비밀번호가 맞지 않습니다.";
          msg.className = "form-msg is-error";
        }
      });
    });
  }

  if (lockBtn) {
    lockBtn.addEventListener("click", function () {
      if (isAdmin()) openPanel();
      else openLogin();
    });
  }
  updateLockIcon();

  /* 다른 기능에서 함께 쓰는 관리자 도우미 */
  window.SiteAdmin = {
    isAdmin: isAdmin,
    requireLogin: function (cb) {
      if (isAdmin()) return cb();
      afterLogin = cb;
      openLogin();
    },
    toCSV: toCSV,
    sha256: sha256,
    download: download,
  };

  /* 저장 후 새로고침했을 때 관리자 화면을 다시 열어 둡니다 */
  if (isAdmin() && session(FLASH_KEY)) openPanel();
})();
</script>
<script>
/* ===== quiz ===== */
/* 실시간 퀴즈 (Kahoot·Socrative 방식)
   - 교수자: 문제 편집 · AI 출제 → 방 만들기 → QR/PIN 대기실 → 문제 진행 → 결과 CSV
   - 학생: QR 촬영 또는 PIN 입력 → 휴대폰으로 답하기 → 정답·순위 확인
   server.py로 사이트를 열었을 때만 작동합니다. 실시간 연결은 서버 전송 이벤트(SSE)를 씁니다. */
(function () {
  "use strict";

  var C = window.SITE_CONFIG;
  var U = window.SiteUtil;
  var S = window.SiteStore;
  if (!C || !U || !S) return;

  var esc = U.esc;
  var list = U.list;
  var qc = C.quiz || {};
  var SHAPES = ["▲", "◆", "●", "■"];
  var PLAYER_KEY = "kc2-quiz-player";
  var HOST_KEY = "kc2-quiz-host";
  var PASS_KEY = "kc2-quiz-pass";
  var health = null;

  /* ---------- 도우미 ---------- */
  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) {
          var err = new Error(d.error || "서버 오류 (" + r.status + ")");
          err.status = r.status;
          throw err;
        }
        return d;
      });
    });
  }
  function ss(key, val) {
    try {
      if (val === undefined) {
        var v = sessionStorage.getItem(key);
        return v ? JSON.parse(v) : null;
      }
      if (val === null) sessionStorage.removeItem(key);
      else sessionStorage.setItem(key, JSON.stringify(val));
    } catch (e) { /* 개인정보 보호 모드 */ }
    return null;
  }
  function setMsg(el, text, type) {
    if (!el) return;
    el.textContent = text;
    el.classList.toggle("is-error", type === "error");
    el.classList.toggle("is-ok", type === "ok");
  }
  function pinText(code) { return String(code).replace(/(\d{3})(\d{3})/, "$1 $2"); }
  function stamp() {
    var d = new Date();
    return d.getFullYear() + U.pad(d.getMonth() + 1) + U.pad(d.getDate()) + "_" + U.pad(d.getHours()) + U.pad(d.getMinutes());
  }

  /* 화면 위에 덮는 전체 화면 창 */
  function overlay(cls, label) {
    var root = document.createElement("div");
    root.className = "qz " + cls;
    root.setAttribute("role", "dialog");
    root.setAttribute("aria-modal", "true");
    root.setAttribute("aria-label", label);
    document.body.appendChild(root);
    document.body.classList.add("qz-open");
    return root;
  }
  function closeOverlay(root) {
    if (root) root.remove();
    if (!document.querySelector(".qz")) document.body.classList.remove("qz-open");
  }

  /* 실시간 연결: 상태가 바뀔 때마다 render 호출, 끊기면 자동 재연결 */
  function connect(ctx, query, render, onGone) {
    if (ctx.es) ctx.es.close();
    var base = "/api/quiz/" + ctx.code + "/";
    var es = new EventSource(base + "events?" + query);
    ctx.es = es;
    es.onmessage = function (e) {
      var st = JSON.parse(e.data);
      ctx.state = st;
      ctx.deadline = Date.now() + (st.remainingMs || 0);
      var conn = ctx.root && ctx.root.querySelector(".qz-conn");
      if (conn) conn.hidden = true;
      render(st);
    };
    es.onerror = function () {
      var conn = ctx.root && ctx.root.querySelector(".qz-conn");
      if (conn) conn.hidden = false;
      fetch(base + "state?" + query).then(function (r) {
        if (r.status === 404 || r.status === 403) {
          es.close();
          onGone();
        }
      }, function () { /* 서버가 잠깐 꺼짐 — EventSource가 다시 시도 */ });
    };
  }

  /* 남은 시간 표시 (0.1초마다) */
  setInterval(function () {
    [P, H].forEach(function (ctx) {
      if (!ctx || !ctx.root || !ctx.state || ctx.state.phase !== "question") return;
      var left = Math.max(0, ctx.deadline - Date.now());
      var total = (ctx.state.question && ctx.state.question.time * 1000) || 1;
      ctx.root.querySelectorAll(".qz-timer").forEach(function (el) { el.textContent = Math.ceil(left / 1000); });
      ctx.root.querySelectorAll(".qz-timebar span").forEach(function (el) { el.style.width = (left / total) * 100 + "%"; });
    });
  }, 100);

  /* ===================== 섹션 ===================== */
  var user = S.currentUser();
  U.fill(
    "quiz",
    U.sectionHead(qc.title || "실시간 퀴즈", qc.lead) +
      '<p class="card quiz-offline" hidden></p>' +
      '<div class="quiz-layout">' +
      '<form class="card quiz-join" novalidate>' +
      "<h3>퀴즈 입장</h3>" +
      '<label class="ed-field"><span>PIN 번호 (6자리)</span>' +
      '<input class="quiz-pin" name="pin" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="123 456" /></label>' +
      '<label class="ed-field"><span>이름 (화면에 보일 이름)</span>' +
      '<input class="quiz-name" name="name" maxlength="20" autocomplete="nickname" placeholder="홍길동" value="' + esc(user ? user.name : "") + '" /></label>' +
      '<button class="btn btn-primary" type="submit">입장하기</button>' +
      '<p class="form-msg" aria-live="polite"></p>' +
      "</form>" +
      '<div class="card quiz-host-card">' +
      "<h3>교수자</h3>" +
      "<p>" + esc(qc.hostText) + "</p>" +
      '<button class="btn btn-primary quiz-host-open" type="button">퀴즈 진행하기</button>' +
      '<button class="btn btn-ghost quiz-host-resume" type="button" hidden>진행 중인 퀴즈로 돌아가기</button>' +
      '<p class="small-note">관리자 로그인이 필요합니다.</p>' +
      "</div>" +
      "</div>"
  );

  var joinForm = document.querySelector(".quiz-join");
  var joinMsg = joinForm.querySelector(".form-msg");
  var offline = document.querySelector(".quiz-offline");

  function markOffline(text) {
    offline.hidden = false;
    offline.textContent = text;
    document.querySelectorAll(".quiz-layout button, .quiz-layout input").forEach(function (el) { el.disabled = true; });
  }

  if (location.protocol === "file:") {
    markOffline("⚠ 실시간 퀴즈는 서버를 켜고 열었을 때만 작동합니다. 폴더에서 「python server.py」를 실행한 뒤 http://localhost:8000 으로 열어 주세요.");
  } else {
    api("GET", "/api/health").then(function (h) {
      health = h;
      resumeSessions();
    }, function () {
      markOffline("⚠ 퀴즈 서버에 연결할 수 없습니다. 실시간 퀴즈는 server.py로 사이트를 열었을 때만 작동합니다.");
    });
  }

  /* QR로 들어온 경우: ?quiz=123456 */
  var params = new URLSearchParams(location.search);
  var qrPin = (params.get("quiz") || "").replace(/\D/g, "");
  if (qrPin) {
    joinForm.elements.pin.value = pinText(qrPin);
    setTimeout(function () {
      document.getElementById("quiz").scrollIntoView();
      var nameInput = joinForm.elements.name;
      if (!nameInput.value) nameInput.focus();
    }, 300);
  }

  joinForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var code = joinForm.elements.pin.value.replace(/\D/g, "");
    var name = joinForm.elements.name.value.trim();
    if (code.length !== 6) return setMsg(joinMsg, "PIN 번호 6자리를 입력해 주세요.", "error");
    if (!name) return setMsg(joinMsg, "이름을 입력해 주세요.", "error");
    var saved = ss(PLAYER_KEY);
    var u = S.currentUser();
    setMsg(joinMsg, "입장하는 중…", "");
    api("POST", "/api/quiz/" + code + "/join", {
      name: name,
      studentId: u ? u.id : "",
      pid: saved && saved.code === code ? saved.pid : undefined,
      token: saved && saved.code === code ? saved.token : undefined,
    }).then(function (d) {
      setMsg(joinMsg, "", "");
      var sess = { code: code, pid: d.pid, token: d.token, name: d.name };
      ss(PLAYER_KEY, sess);
      openPlayer(sess);
    }, function (err) {
      setMsg(joinMsg, err.message, "error");
    });
  });

  document.querySelector(".quiz-host-open").addEventListener("click", function () {
    var go = function () {
      if (H && H.root) return;
      openBuilder();
    };
    if (window.SiteAdmin) window.SiteAdmin.requireLogin(go);
    else go();
  });
  document.querySelector(".quiz-host-resume").addEventListener("click", function () {
    var sess = ss(HOST_KEY);
    if (sess) window.SiteAdmin.requireLogin(function () { openHostLive(sess); });
  });

  /* 새로고침해도 하던 퀴즈로 돌아가기 */
  function resumeSessions() {
    var p = ss(PLAYER_KEY);
    if (p) {
      api("GET", "/api/quiz/" + p.code + "/state?pid=" + encodeURIComponent(p.pid) + "&token=" + encodeURIComponent(p.token)).then(function (st) {
        if (st.phase !== "ended" && !st.kicked) openPlayer(p);
        else ss(PLAYER_KEY, null);
      }, function () { ss(PLAYER_KEY, null); });
    }
    var h = ss(HOST_KEY);
    if (h) {
      api("GET", "/api/quiz/" + h.code + "/state?hostKey=" + encodeURIComponent(h.hostKey)).then(function (st) {
        document.querySelector(".quiz-host-resume").hidden = false;
        document.querySelector(".quiz-host-resume").textContent = "진행 중인 퀴즈로 돌아가기 (PIN " + pinText(h.code) + ")";
      }, function () { ss(HOST_KEY, null); });
    }
  }

  /* ===================== 학생 화면 ===================== */
  var P = null;

  function openPlayer(sess) {
    if (P && P.root) closeOverlay(P.root);
    P = { code: sess.code, pid: sess.pid, token: sess.token, name: sess.name, key: "" };
    P.root = overlay("qz-player", "실시간 퀴즈 참여");
    P.root.innerHTML =
      '<header class="qz-bar"><strong class="qz-title">실시간 퀴즈</strong>' +
      '<span class="qz-me">' + esc(sess.name) + "</span>" +
      '<span class="qz-score">0점</span>' +
      '<button class="qz-x" type="button" aria-label="퀴즈 나가기">×</button></header>' +
      '<main class="qz-stage" aria-live="polite"></main>' +
      '<div class="qz-conn" hidden>연결이 끊겨 다시 연결하는 중…</div>';
    P.root.querySelector(".qz-x").addEventListener("click", function () {
      if (P.state && P.state.phase !== "ended" && !confirm("퀴즈에서 나갈까요? 같은 기기에서 다시 입장하면 점수가 이어집니다.")) return;
      leavePlayer();
    });
    P.root.addEventListener("click", function (e) {
      var btn = e.target.closest(".qz-choice");
      if (btn && !btn.disabled) submitAnswer(Number(btn.getAttribute("data-choice")));
      if (e.target.closest(".qz-done")) {
        ss(PLAYER_KEY, null);
        leavePlayer();
      }
    });
    connect(P, "pid=" + encodeURIComponent(P.pid) + "&token=" + encodeURIComponent(P.token), renderPlayer, function () {
      P.root.querySelector(".qz-stage").innerHTML =
        '<div class="qz-center"><p class="qz-big">퀴즈가 끝났거나 연결이 종료되었습니다.</p>' +
        '<button class="btn btn-primary qz-done" type="button">닫기</button></div>';
      ss(PLAYER_KEY, null);
    });
  }
  function leavePlayer() {
    if (!P) return;
    if (P.es) P.es.close();
    closeOverlay(P.root);
    P = null;
  }

  function submitAnswer(choice) {
    var st = P.state;
    P.root.querySelectorAll(".qz-choice").forEach(function (b) {
      b.disabled = true;
      b.classList.toggle("is-picked", Number(b.getAttribute("data-choice")) === choice);
    });
    api("POST", "/api/quiz/" + P.code + "/answer", { pid: P.pid, token: P.token, qi: st.qi, choice: choice }).catch(function (err) {
      var m = P.root.querySelector(".qz-answer-msg");
      if (m) m.textContent = err.message;
    });
  }

  function renderPlayer(st) {
    if (!P) return;
    if (st.kicked) {
      ss(PLAYER_KEY, null);
      return leavePlayer();
    }
    P.root.querySelector(".qz-title").textContent = st.title;
    P.root.querySelector(".qz-score").textContent = (st.me ? st.me.score : 0) + "점";
    var key = st.phase + ":" + st.qi + ":" + (st.myAnswer ? 1 : 0);
    var stage = P.root.querySelector(".qz-stage");
    var pc = stage.querySelector(".pc");
    if (pc) pc.textContent = st.playerCount;
    if (key === P.key) return;
    P.key = key;
    var q = st.question;
    var html = "";

    if (st.phase === "lobby") {
      html =
        '<div class="qz-center">' +
        '<p class="qz-big">입장 완료!</p>' +
        '<p class="qz-name">' + esc(st.me.name) + "</p>" +
        "<p>선생님이 퀴즈를 시작하기를 기다리고 있어요.</p>" +
        '<p class="qz-count"><span class="pc">' + st.playerCount + "</span>명 참여 중</p>" +
        '<div class="qz-dots" aria-hidden="true"><i></i><i></i><i></i></div></div>';
    } else if (st.phase === "question" && !st.myAnswer) {
      html =
        '<div class="qz-q-head"><span>문제 ' + (st.qi + 1) + " / " + st.total + '</span><span class="qz-timer"></span></div>' +
        '<div class="qz-timebar"><span></span></div>' +
        '<p class="qz-question">' + esc(q.q) + "</p>" +
        '<div class="qz-choices">' +
        list(q.choices, function (c, i) {
          return (
            '<button class="qz-choice c' + i + '" type="button" data-choice="' + i + '">' +
            '<span class="qz-shape" aria-hidden="true">' + SHAPES[i] + "</span><span>" + esc(c) + "</span></button>"
          );
        }) +
        '</div><p class="qz-answer-msg" role="status"></p>';
    } else if (st.phase === "question") {
      var a = st.myAnswer;
      html =
        '<div class="qz-center">' +
        '<span class="qz-picked c' + a.choice + '" aria-hidden="true">' + SHAPES[a.choice] + "</span>" +
        '<p class="qz-big">답을 냈어요!</p>' +
        "<p>다른 친구들을 기다리는 중… <b class=\"qz-timer\"></b>초</p></div>";
    } else if (st.phase === "reveal") {
      var mine = st.myAnswer;
      var head = !mine
        ? '<div class="qz-result none"><b>시간 초과</b><span>이번 문제는 답을 내지 못했어요</span></div>'
        : mine.correct
          ? '<div class="qz-result ok"><b>정답! ✓</b><span>+' + mine.points + "점</span></div>"
          : '<div class="qz-result no"><b>아쉬워요 ✗</b><span>다음 문제에서 만회해요</span></div>';
      html =
        head +
        '<div class="qz-reveal-box">' +
        '<p class="qz-small">정답</p>' +
        '<p class="qz-correct c' + q.answer + '"><span aria-hidden="true">' + SHAPES[q.answer] + "</span> " + esc(q.choices[q.answer]) + "</p>" +
        (q.explanation ? '<p class="qz-expl">' + esc(q.explanation) + "</p>" : "") +
        '<p class="qz-rank">지금 <b>' + st.me.rank + "등</b> · 총점 <b>" + st.me.score + "점</b></p>" +
        "</div>";
    } else if (st.phase === "ended") {
      var r = st.me.rank;
      html =
        '<div class="qz-center qz-final">' +
        '<p class="qz-small">최종 결과</p>' +
        '<p class="qz-medal" aria-hidden="true">' + (r === 1 ? "🥇" : r === 2 ? "🥈" : r === 3 ? "🥉" : "🎉") + "</p>" +
        '<p class="qz-big">' + r + "등 · " + st.me.score + "점</p>" +
        '<ol class="qz-top">' + list(st.top, function (t) { return "<li><span>" + t.rank + ". " + esc(t.name) + "</span><b>" + t.score + "</b></li>"; }) + "</ol>" +
        '<button class="btn btn-primary qz-done" type="button">닫기</button></div>';
      ss(PLAYER_KEY, null);
      if (r && r <= 3 && window.SiteFx) window.SiteFx.fireworks();
    }
    stage.innerHTML = html;
    var first = stage.querySelector(".qz-choice, .qz-done");
    if (first) first.focus({ preventScroll: true });
  }

  /* ===================== 교수자: 문제 만들기 ===================== */
  var H = null;
  var draft = null;

  function blankQuestion() {
    return { q: "", choices: ["", "", "", ""], answer: 0, time: qc.defaultTime || 20, explanation: "" };
  }
  function loadDraft() {
    var d = S.prefGet("quizDraft", null);
    if (d && Array.isArray(d.questions)) return d;
    var sample = qc.sample || { title: "실시간 퀴즈", questions: [] };
    var copy = JSON.parse(JSON.stringify(sample));
    copy.questions = copy.questions.map(function (q) {
      while (q.choices.length < 4) q.choices.push("");
      return q;
    });
    if (!copy.questions.length) copy.questions.push(blankQuestion());
    return copy;
  }
  function saveDraft() { S.prefSet("quizDraft", draft); }

  function weekOptions() {
    return list(C.curriculum.weeks.filter(function (w) { return w.type !== "exam"; }), function (w) {
      var topic = w.week + "주차 " + w.title + " (" + w.note + (w.expression ? ", 예: " + w.expression : "") + ")";
      return '<option value="' + esc(topic) + '">' + esc(w.week + "주차 · " + w.title) + "</option>";
    });
  }

      '<div class="qz-qcard" data-i="' + i + '">' +
      '<div class="qz-qcard-head"><strong>' + (i + 1) + "</strong>" +
      '<span class="ed-tools">' +
      '<button type="button" data-op="up" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + ' aria-label="위로">↑</button>' +
      '<button type="button" data-op="down" data-i="' + i + '"' + (i === n - 1 ? " disabled" : "") + ' aria-label="아래로">↓</button>' +
      '<button type="button" data-op="del" data-i="' + i + '">삭제</button></span></div>' +
      '<label class="ed-field"><span>질문</span><textarea rows="2" data-k="q" data-i="' + i + '">' + esc(q.q) + "</textarea></label>" +

      list([0, 1, 2, 3], function (c) {
        return (
          '<label class="qz-qchoice c' + c + '">' +
          '<input type="radio" name="ans-' + i + '" data-k="answer" data-i="' + i + '" value="' + c + '"' + (q.answer === c ? " checked" : "") + ' aria-label="' + (c + 1) + '번을 정답으로" />' +

      '<label class="ed-field qz-expl-field"><span>해설 (정답 공개 때 표시)</span><input type="text" data-k="explanation" data-i="' + i + '" value="' + esc(q.explanation || "") + '" /></label>' +
      "</div></div>"

      "</div></div>" +

        : provider === "baze"
          ? '<p class="small-note">BAZE API 키를 저장하면 바로 AI로 만들 수 있습니다. 키가 없으면 아래 <b>프롬프트 복사</b> 방식을 쓰세요.</p>'
          : '<p class="small-note">서버에 Claude API 키가 없어 <b>프롬프트 복사</b> 방식으로 만듭니다. 복사한 프롬프트를 Claude나 ChatGPT에 붙여 넣고, 받은 답을 아래 칸에 붙여 넣으세요. BAZE API 키가 있으면 위에서 BAZE를 고르세요.</p>') +
      '<label class="ed-field"><span>커리큘럼에서 고르기</span><select class="ai-week"><option value="">직접 입력</option>' + weekOptions() + "</select></label>" +
      '<label class="ed-field"><span>주제</span><input class="ai-topic" placeholder="예: 동태조사 了와 过 구분" /></label>' +
      '<div class="qz-ai-row">' +
      '<label class="ed-field"><span>난이도</span><select class="ai-level"><option>쉬움</option><option selected>보통</option><option>어려움</option></select></label>' +
      '<label class="ed-field"><span>문항 수</span><input class="ai-count" type="number" min="1" max="15" value="5" /></label>' +
      '<label class="ed-field"><span>제한 시간</span><select class="ai-time"><option value="10">10초</option><option value="20" selected>20초</option><option value="30">30초</option></select></label>' +
      "</div>" +
      '<label class="ed-field"><span>추가 요청 (선택)</span><input class="ai-extra" placeholder="예: 성조 문제를 2개 넣어 주세요" /></label>' +
      (aiOn ? '<button class="btn btn-primary ai-go" type="button">AI로 만들기</button>' : "") +
      '<details class="qz-paste"' + (aiOn ? "" : " open") + "><summary>프롬프트 복사 · 답 붙여넣기</summary>" +
      '<button class="btn btn-ghost btn-sm ai-copy" type="button">프롬프트 복사</button>' +
      '<textarea class="ai-prompt" rows="3" readonly hidden aria-label="복사할 프롬프트"></textarea>' +
      '<textarea class="ai-paste" rows="4" placeholder="AI가 준 답(JSON)을 여기에 붙여 넣으세요"></textarea>' +
      '<button class="btn btn-ghost btn-sm ai-import" type="button">문제로 가져오기</button>' +

  function refreshAiPanel(msgText, msgType) {
    var side = H.root.querySelector(".qz-build-side");
    var keep = {};
    [".ai-week", ".ai-topic", ".ai-level", ".ai-count", ".ai-time", ".ai-extra"].forEach(function (sel) {
      var el = side.querySelector(sel);
      if (el) keep[sel] = el.value;
    });
    side.innerHTML = aiPanel();
    Object.keys(keep).forEach(function (sel) {
      var el = side.querySelector(sel);
      if (el) el.value = keep[sel];
    });
    if (msgText) setMsg(side.querySelector(".ai-msg"), msgText, msgType);
  }

  function openBuilder() {
    draft = loadDraft();
    H = { root: overlay("qz-host", "실시간 퀴즈 만들기") };
    renderBuilder();
    bindBuilder();
  }

  function renderBuilder(keepScroll) {
    var main = H.root.querySelector(".qz-build-main");
    var y = main ? main.scrollTop : 0;
    var sets = S.prefGet("quizSets", []);
    var needPass = health && health.hostPasswordRequired;
    H.root.innerHTML =
      '<header class="qz-bar"><strong>실시간 퀴즈 만들기</strong>' +
      '<button class="qz-x" type="button" aria-label="닫기">×</button></header>' +
      '<div class="qz-build">' +
      '<div class="qz-build-main">' +
      '<label class="ed-field"><span>퀴즈 제목</span><input class="qz-title-input" value="' + esc(draft.title) + '" maxlength="80" /></label>' +
      '<div class="qz-sets">' +
      '<select class="qz-set-pick" aria-label="저장한 퀴즈"><option value="">저장한 퀴즈 불러오기…</option>' +
      list(sets, function (s, i) { return '<option value="' + i + '">' + esc(s.title) + " (" + s.questions.length + "문항)</option>"; }) +
      "</select>" +
      '<button class="btn btn-ghost btn-sm qz-set-save" type="button">이 퀴즈 저장</button>' +
      '<button class="btn btn-ghost btn-sm qz-set-del" type="button"' + (sets.length ? "" : " disabled") + ">선택한 퀴즈 삭제</button>" +
      '<button class="btn btn-ghost btn-sm qz-clear" type="button">모두 비우기</button>' +
      "</div>" +
      '<div class="qz-qlist">' + list(draft.questions, function (q, i) { return questionCard(q, i, draft.questions.length); }) + "</div>" +
      '<button class="ed-add qz-add" type="button">+ 문제 추가</button>' +
      "</div>" +
      '<aside class="qz-build-side">' + aiPanel() + "</aside>" +
      "</div>" +
      '<footer class="qz-build-foot">' +
      (needPass ? '<input type="password" class="qz-pass" placeholder="교수자 비밀번호 (서버)" value="' + esc(ss(PASS_KEY) || "") + '" aria-label="교수자 비밀번호" />' : "") +
      '<span class="qz-build-info">' + draft.questions.length + "문항 · 자동 저장됨</span>" +
      '<p class="form-msg qz-start-msg" aria-live="polite"></p>' +
      '<button class="btn btn-primary qz-start" type="button">퀴즈 방 만들기 ▶</button>' +
      "</footer>";
    if (keepScroll) H.root.querySelector(".qz-build-main").scrollTop = y;
  }

  function bindBuilder() {
    var root = H.root;
    root.addEventListener("input", function (e) {
      var el = e.target;
      if (el.classList.contains("qz-title-input")) {
        draft.title = el.value;
        return saveDraft();
      }
      if (el.classList.contains("qz-pass")) return ss(PASS_KEY, el.value);
      var k = el.getAttribute("data-k");
      if (!k) return;
      var q = draft.questions[Number(el.getAttribute("data-i"))];
      if (k === "choice") q.choices[Number(el.getAttribute("data-c"))] = el.value;
      else if (k === "answer") q.answer = Number(el.value);
      else if (k === "time") q.time = Number(el.value);
      else q[k] = el.value;
      saveDraft();
    });
    root.addEventListener("change", function (e) {
      var el = e.target;
      if (el.getAttribute("data-k") === "answer" || el.getAttribute("data-k") === "time") el.dispatchEvent(new Event("input", { bubbles: true }));
      if (el.classList.contains("ai-week") && el.value) root.querySelector(".ai-topic").value = el.value;
      if (el.name === "ai-provider") {
        S.prefSet("aiProvider", el.value);
        return refreshAiPanel();
      }
      if (el.classList.contains("qz-set-pick") && el.value !== "") {
        var set = S.prefGet("quizSets", [])[Number(el.value)];
        if (set && confirm("‘" + set.title + "’을(를) 불러올까요? 지금 편집 중인 문제는 바뀝니다.")) {
          draft = JSON.parse(JSON.stringify(set));
          saveDraft();
          renderBuilder();
        }
      }
    });
    root.addEventListener("click", function (e) {
      var t = e.target;
      if (t.closest(".qz-x")) {
        closeOverlay(H.root);
        H = null;
        return;
      }
      var op = t.closest("[data-op]");
      if (op) {
        var i = Number(op.getAttribute("data-i"));
        var qs = draft.questions;
        if (op.getAttribute("data-op") === "del") {
          if (!confirm((i + 1) + "번 문제를 지울까요?")) return;
          qs.splice(i, 1);
          if (!qs.length) qs.push(blankQuestion());
        } else if (op.getAttribute("data-op") === "up" && i > 0) qs.splice(i - 1, 0, qs.splice(i, 1)[0]);
        else if (op.getAttribute("data-op") === "down" && i < qs.length - 1) qs.splice(i + 1, 0, qs.splice(i, 1)[0]);
        saveDraft();
        return renderBuilder(true);
      }
      if (t.closest(".qz-add")) {
        draft.questions.push(blankQuestion());
        saveDraft();
        renderBuilder(true);
        var cards = H.root.querySelectorAll(".qz-qcard textarea");
        cards[cards.length - 1].focus();
        return;
      }
      if (t.closest(".qz-set-save")) {
        var sets = S.prefGet("quizSets", []);
        var title = (draft.title || "실시간 퀴즈").trim();
        var idx = sets.findIndex(function (s) { return s.title === title; });
        var copy = JSON.parse(JSON.stringify({ title: title, questions: draft.questions, savedAt: new Date().toISOString() }));
        if (idx >= 0) sets[idx] = copy;
        else sets.push(copy);
        S.prefSet("quizSets", sets);
        renderBuilder(true);
        return setMsg(H.root.querySelector(".qz-start-msg"), "‘" + title + "’을(를) 저장했습니다.", "ok");
      }
      if (t.closest(".qz-set-del")) {
        var pick = H.root.querySelector(".qz-set-pick");
        if (pick.value === "") return setMsg(H.root.querySelector(".qz-start-msg"), "삭제할 퀴즈를 먼저 고르세요.", "error");
        var all = S.prefGet("quizSets", []);
        if (!confirm("‘" + all[Number(pick.value)].title + "’을(를) 삭제할까요?")) return;
        all.splice(Number(pick.value), 1);
        S.prefSet("quizSets", all);
        return renderBuilder(true);
      }
      if (t.closest(".qz-clear")) {
        if (!confirm("모든 문제를 지우고 새로 시작할까요?")) return;
        draft = { title: "실시간 퀴즈", questions: [blankQuestion()] };
        saveDraft();
        return renderBuilder();
      }
      if (t.closest(".baze-save")) {
        var v = H.root.querySelector(".baze-key").value.trim();
        if (!v) return setMsg(H.root.querySelector(".ai-msg"), "BAZE API 키를 입력해 주세요.", "error");
        S.prefSet("bazeKey", v);
        S.prefSet("aiProvider", "baze");
        return refreshAiPanel("BAZE API 키를 저장했습니다. 이제 AI로 만들기를 누르면 BAZE로 문제를 만듭니다.", "ok");
      }
      if (t.closest(".baze-clear")) {
        if (!confirm("이 브라우저에 저장된 BAZE API 키를 지울까요?")) return;
        S.prefSet("bazeKey", "");
        return refreshAiPanel("저장된 BAZE API 키를 지웠습니다.", "ok");
      }
      if (t.closest(".ai-go")) return aiGenerate();
      if (t.closest(".ai-copy")) return copyPrompt();
      if (t.closest(".ai-import")) return importPasted();
      if (t.closest(".qz-start")) return createRoom();
    });
  }

  function aiInputs() {
    var r = H.root;
    return {
      topic: r.querySelector(".ai-topic").value.trim(),
      level: r.querySelector(".ai-level").value,
      count: Math.min(15, Math.max(1, Number(r.querySelector(".ai-count").value) || 5)),
      time: Number(r.querySelector(".ai-time").value) || 20,
      extra: r.querySelector(".ai-extra").value.trim(),
    };
  }
  function addQuestions(qs, time) {
    var clean = qs
      .map(function (q) {
        var choices = (q.choices || []).map(function (c) { return String(c || "").trim(); }).slice(0, 4);
        var ans = q.answer;
        if (typeof ans === "string" && /^[A-Da-d]$/.test(ans)) ans = ans.toUpperCase().charCodeAt(0) - 65;
        ans = Number(ans);
        while (choices.length < 4) choices.push("");
        return {
          q: String(q.q || q.question || "").trim(),
          choices: choices,
          answer: ans >= 0 && ans < 4 ? ans : 0,
          time: Number(q.time) || time || 20,
          explanation: String(q.explanation || "").trim(),
        };
      })
      .filter(function (q) { return q.q && q.choices.filter(Boolean).length >= 2; });
    if (!clean.length) return 0;
    /* 비어 있는 문제 칸은 새 문제로 바꿔 넣기 */
    draft.questions = draft.questions.filter(function (q) { return q.q.trim() || q.choices.some(Boolean); }).concat(clean);
    saveDraft();
    return clean.length;
  }
  function aiGenerate() {
    var inp = aiInputs();
    var msg = H.root.querySelector(".ai-msg");
    if (!inp.topic) return setMsg(msg, "주제를 입력하거나 커리큘럼에서 골라 주세요.", "error");
    var btn = H.root.querySelector(".ai-go");
    btn.disabled = true;
    btn.textContent = (currentProvider() === "baze" ? "BAZE" : "Claude") + "로 문제를 만드는 중… (10~40초)";
    setMsg(msg, "", "");
    api("POST", "/api/ai/questions", {
      topic: inp.topic, level: inp.level, count: inp.count, time: inp.time, extra: inp.extra, password: ss(PASS_KEY) || "",
      provider: currentProvider(), bazeKey: currentProvider() === "baze" ? S.prefGet("bazeKey", "") : "",
    }).then(function (d) {
      var n = addQuestions(d.questions, inp.time);
      renderBuilder(true);
      H.root.querySelector(".qz-build-main").scrollTop = 1e6;
      setMsg(H.root.querySelector(".ai-msg"), n + "문제를 목록 끝에 추가했습니다. 정답과 내용을 검토해 주세요.", "ok");
    }, function (err) {
      btn.disabled = false;
      btn.textContent = "AI로 만들기";
      setMsg(msg, err.message, "error");
      if (err.status === 503) H.root.querySelector(".qz-paste").open = true;
    });
  }
  function buildPrompt(inp) {
    return (
      "고려대학교 교양 과목 「교양중국어2」(교양중국어1을 마친 학부생 대상) 수업에서 휴대폰으로 푸는 실시간 퀴즈 문제를 만들어 주세요.\n\n" +
      "- 주제: " + inp.topic + "\n- 난이도: " + inp.level + "\n- 문항 수: " + inp.count + "개\n" +
      (inp.extra ? "- 추가 요청: " + inp.extra + "\n" : "") +
      "\n조건\n" +
      "- 모든 문항은 4지선다이며 정답은 하나입니다. answer는 정답 보기의 번호(0부터 시작)입니다.\n" +
      "- 정답 위치가 한쪽으로 몰리지 않게 섞어 주세요.\n" +
      "- 질문은 한국어로 쓰고, 중국어는 간체자로 쓰며 필요하면 괄호 안에 병음을 붙입니다.\n" +
      "- 휴대폰 화면에서 읽기 쉽게 질문은 2줄 이내, 보기는 각 25자 이내로 짧게 씁니다.\n" +
      "- 오답 보기는 학생이 실제로 헷갈릴 만한 것으로 만듭니다.\n" +
      "- explanation에는 정답인 이유를 한국어 한 문장으로 씁니다.\n\n" +
      "다른 설명 없이 아래 형식의 JSON만 답해 주세요.\n" +
      '{"questions":[{"question":"질문","choices":["보기1","보기2","보기3","보기4"],"answer":0,"explanation":"해설"}]}'
    );
  }
  function copyPrompt() {
    var inp = aiInputs();
    var msg = H.root.querySelector(".ai-msg");
    if (!inp.topic) return setMsg(msg, "주제를 입력하거나 커리큘럼에서 골라 주세요.", "error");
    var box = H.root.querySelector(".ai-prompt");
    box.value = buildPrompt(inp);
    box.hidden = false;
    var done = function () { setMsg(msg, "프롬프트를 복사했습니다. Claude나 ChatGPT에 붙여 넣고, 받은 답을 아래 칸에 붙여 넣으세요.", "ok"); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(box.value).then(done, function () {
        box.select();
        setMsg(msg, "자동 복사가 막혀 있습니다. 위 칸의 글을 직접 복사해 주세요 (Ctrl+C).", "error");
      });
    } else {
      box.select();
      try {
        document.execCommand("copy");
        done();
      } catch (e) {
        setMsg(msg, "위 칸의 글을 직접 복사해 주세요 (Ctrl+C).", "error");
      }
    }
  }
  function importPasted() {
    var text = H.root.querySelector(".ai-paste").value.trim();
    var msg = H.root.querySelector(".ai-msg");
    if (!text) return setMsg(msg, "AI가 준 답을 먼저 붙여 넣어 주세요.", "error");
    var data = null;
    var tries = [text];
    var o = text.indexOf("{");
    var a = text.indexOf("[");
    if (o >= 0) tries.push(text.slice(o, text.lastIndexOf("}") + 1));
    if (a >= 0) tries.push(text.slice(a, text.lastIndexOf("]") + 1));
    for (var i = 0; i < tries.length && !data; i++) {
      try { data = JSON.parse(tries[i]); } catch (e) { /* 다음 방법 */ }
    }
    var qs = data && (Array.isArray(data) ? data : data.questions);
    if (!Array.isArray(qs)) return setMsg(msg, "문제 형식(JSON)을 찾지 못했습니다. AI에게 ‘JSON만 답해 달라’고 다시 요청해 보세요.", "error");
    var n = addQuestions(qs, aiInputs().time);
    if (!n) return setMsg(msg, "가져올 수 있는 문제가 없습니다. 질문과 보기가 있는지 확인해 주세요.", "error");
    renderBuilder(true);
    H.root.querySelector(".qz-build-main").scrollTop = 1e6;
    setMsg(H.root.querySelector(".ai-msg"), n + "문제를 가져왔습니다. 정답과 내용을 검토해 주세요.", "ok");
  }

  function validateDraft() {
    var errors = [];
    var out = [];
    draft.questions.forEach(function (q, i) {
      var filled = q.choices.map(function (c, ci) { return { c: c.trim(), ci: ci }; }).filter(function (x) { return x.c; });
      if (!q.q.trim()) errors.push((i + 1) + "번: 질문이 비어 있습니다.");
      else if (filled.length < 2) errors.push((i + 1) + "번: 보기를 2개 이상 써 주세요.");
      else if (!q.choices[q.answer] || !q.choices[q.answer].trim()) errors.push((i + 1) + "번: 정답으로 고른 보기가 비어 있습니다.");
      else {
        out.push({
          q: q.q.trim(),
          choices: filled.map(function (x) { return x.c; }),
          answer: filled.findIndex(function (x) { return x.ci === q.answer; }),
          time: q.time,
          explanation: (q.explanation || "").trim(),
        });
      }
    });
    return { errors: errors, questions: out };
  }

  function createRoom() {
    var msg = H.root.querySelector(".qz-start-msg");
    var v = validateDraft();
    if (v.errors.length) return setMsg(msg, v.errors.slice(0, 3).join(" ") + (v.errors.length > 3 ? " 외 " + (v.errors.length - 3) + "건" : ""), "error");
    var btn = H.root.querySelector(".qz-start");
    btn.disabled = true;
    setMsg(msg, "퀴즈 방을 만드는 중…", "");
    api("POST", "/api/quiz", { title: draft.title || "실시간 퀴즈", questions: v.questions, password: ss(PASS_KEY) || "" }).then(function (d) {
      var sess = { code: d.code, hostKey: d.hostKey };
      ss(HOST_KEY, sess);
      closeOverlay(H.root);
      H = null;
      openHostLive(sess);
    }, function (err) {
      btn.disabled = false;
      setMsg(msg, err.message, "error");
      if (err.status === 403 && !H.root.querySelector(".qz-pass")) {
        health.hostPasswordRequired = true;
        renderBuilder(true);
        setMsg(H.root.querySelector(".qz-start-msg"), err.message + " 아래 칸에 입력해 주세요.", "error");
      }
    });
  }

  /* ===================== 교수자: 진행 화면 ===================== */
  function joinUrl(code) {
    var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    var base = local && health && health.lanUrl ? health.lanUrl : location.origin;
    return base + location.pathname + "?quiz=" + code;
  }
  var qrLib = null;
  function loadQR() {
    if (window.QRCode) return Promise.resolve(window.QRCode);
    if (qrLib) return qrLib;
    qrLib = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
      s.onload = function () { resolve(window.QRCode); };
      s.onerror = reject;
      document.head.appendChild(s);
    });
    return qrLib;
  }

  function openHostLive(sess) {
    if (H && H.root) closeOverlay(H.root);
    H = { code: sess.code, hostKey: sess.hostKey, key: "" };
    H.root = overlay("qz-host qz-live", "실시간 퀴즈 진행");
    H.root.innerHTML =
      '<header class="qz-bar"><strong class="qz-title">실시간 퀴즈</strong>' +
      '<span class="qz-pin-chip">PIN <b>' + pinText(sess.code) + "</b></span>" +
      '<button class="btn btn-ghost btn-sm qz-end" type="button">퀴즈 끝내기</button>' +
      '<button class="qz-x" type="button" aria-label="창 닫기 (퀴즈는 계속됨)">×</button></header>' +
      '<main class="qz-stage"></main>' +
      '<div class="qz-conn" hidden>연결이 끊겨 다시 연결하는 중…</div>';
    H.root.addEventListener("click", function (e) {
      var t = e.target;
      if (t.closest(".qz-x")) {
        if (H.es) H.es.close();
        closeOverlay(H.root);
        var stillOn = H.state && H.state.phase !== "ended";

        resume.hidden = !stillOn;
        if (stillOn) resume.textContent = "진행 중인 퀴즈로 돌아가기 (PIN " + pinText(sess.code) + ")";

        H = null;
        ss(HOST_KEY, null);
        document.querySelector(".quiz-host-resume").hidden = true;
        return openBuilder();

    });
    connect(H, "hostKey=" + encodeURIComponent(H.hostKey), renderHost, function () {
      H.root.querySelector(".qz-stage").innerHTML =
        '<div class="qz-center"><p class="qz-big">퀴즈 방을 찾을 수 없습니다.</p><p>서버가 다시 시작되면 진행 중이던 퀴즈는 사라집니다.</p>' +
        '<button class="btn btn-primary qz-new" type="button">새 퀴즈 만들기</button></div>';
      ss(HOST_KEY, null);
    });

  function renderHost(st) {

        '<div class="qz-timebar"><span></span></div>' +
        '<p class="qz-question qz-question-big">' + esc(q.q) + "</p>" +

        list(q.choices, function (c, i) {
          return '<div class="qz-choice c' + i + '"><span class="qz-shape" aria-hidden="true">' + SHAPES[i] + "</span><span>" + esc(c) + "</span></div>";
        }) +
        "</div>" +
        '<div class="qz-host-actions"><button class="btn btn-ghost" type="button" data-act="reveal">바로 정답 공개</button>' +
        '<p class="qz-host-msg" role="status"></p></div></div>';
    } else if (st.phase === "reveal") {
      var max = Math.max.apply(null, st.counts.concat([1]));

        '<p class="qz-question">' + esc(q.q) + "</p>" +
        '<div class="qz-reveal">' +

          return (

          );

  function updateLobby(st) {
    var stage = H.root.querySelector(".qz-stage");
    var n = stage.querySelector(".qz-pcount");
    if (n) n.textContent = st.players.length;
    var chips = stage.querySelector(".qz-chips");
    if (chips) chips.innerHTML = list(st.players, function (p) { return "<li>" + esc(p) + "</li>"; });
    var go = stage.querySelector(".qz-go");
    if (go) {
      go.disabled = !st.players.length;
      go.textContent = st.players.length ? "퀴즈 시작 ▶" : "학생 입장을 기다리는 중…";
    }

  function downloadResults() {
    var msg = H.root.querySelector(".qz-host-msg");
    api("GET", "/api/quiz/" + H.code + "/results?hostKey=" + encodeURIComponent(H.hostKey)).then(function (r) {
      var head = ["순위", "이름", "학번", "총점", "정답 수"];
      r.questions.forEach(function (q, i) {
        var n = "Q" + (i + 1);
        head.push(n + " 선택", n + " 정답 여부", n + " 응답 시간(초)", n + " 점수");
      });
      var rows = [head];
      r.players.forEach(function (p) {
        var correct = p.answers.filter(function (a) { return a && a.correct; }).length;
        var row = [p.rank, p.name, p.studentId, p.score, correct];
        p.answers.forEach(function (a, i) {
          if (!a) return row.push("", "미응답", "", 0);
          row.push((a.choice + 1) + ") " + r.questions[i].choices[a.choice], a.correct ? "O" : "X", (a.ms / 1000).toFixed(1), a.points);
        });
        rows.push(row);
      });
      /* 아래쪽에 문제와 정답·정답률 정리 */
      rows.push([]);
      rows.push(["문항", "질문", "정답", "정답률", "보기"]);
      r.questions.forEach(function (q, i) {
        var answered = r.players.filter(function (p) { return p.answers[i]; });
        var ok = answered.filter(function (p) { return p.answers[i].correct; }).length;
        rows.push([
          "Q" + (i + 1), q.q, (q.answer + 1) + ") " + q.choices[q.answer],
          r.players.length ? Math.round((ok / r.players.length) * 100) + "%" : "-",
          q.choices.map(function (c, ci) { return ci + 1 + ") " + c; }).join(" / "),
        ]);
      });
      var title = (r.title || "퀴즈").replace(/[\\/:*?"<>|]/g, "").slice(0, 30);
      window.SiteAdmin.download("퀴즈결과_" + title + "_" + stamp() + ".csv", window.SiteAdmin.toCSV(rows), "text/csv;charset=utf-8");
      if (msg) msg.textContent = "결과 파일을 내려받았습니다. 엑셀에서 바로 열 수 있습니다.";
    }, function (err) {
      if (msg) msg.textContent = err.message;
    });
  }
})();
</script>
</body>
</html>
