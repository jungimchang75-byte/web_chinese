    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }
  function notify(topic) {
    listeners.forEach(function (fn) { fn(topic); });
  }
  function save(topic, value) {
    var ok = write(DATA + topic, value);
    notify(topic);
    return ok;
  }

  /* 다른 탭에서 바뀐 내용도 바로 반영 (같은 브라우저 안에서의 실시간) */
  window.addEventListener("storage", function (e) {
    if (e.key && e.key.indexOf(DATA) === 0) notify(e.key.slice(DATA.length).split(":")[0]);
  });

  function now() { return new Date().toISOString(); }

  return {
    onChange: function (fn) { listeners.push(fn); },

    /* 방문자 설정 */
    prefGet: function (key, fallback) { return read(PREF + key, fallback); },
    prefSet: function (key, value) { return write(PREF + key, value); },
    browserId: function () {
      var id = read(PREF + "browserId", null);
      if (!id) {
        id = Math.random().toString(36).slice(2, 10);
        write(PREF + "browserId", id);
      }
      return id;
    },

    /* 투표: { votes: { 투표자: 선택지 } } — 한 사람당 한 표, 다시 고르면 바뀝니다 */
    getPoll: function () { return read(DATA + "poll", { votes: {} }); },
    vote: function (voter, optionId) {
      var p = this.getPoll();
      p.votes[voter] = optionId;
      return save("poll", p);
    },

    /* 수강 신청서 */
    listApplications: function () { return read(DATA + "applications", []); },
    submitApplication: function (data) {
      var all = this.listApplications();
      var rec = { no: "KC2-" + String(all.length + 1).padStart(4, "0"), at: now(), data: data };
      all.push(rec);
      return save("applications", all) ? rec : null;
    },

    /* 로그인 (시연용: 학번 + 이름) — 로그인한 적 있는 학생은 students에 기록해 관리자 표에 이름을 보여 줍니다 */
    currentUser: function () { return read(DATA + "session", null); },
    login: function (id, name) {
      var seen = read(DATA + "students", {});
      seen[id] = name;
      write(DATA + "students", seen);
      return save("session", { id: id, name: name, at: now() });
    },
    knownStudents: function () { return read(DATA + "students", {}); },
    logout: function () {
      try { localStorage.removeItem(DATA + "session"); } catch (e) { /* 무시 */ }
      notify("session");
    },

    /* 출석: { 학번: { 주차: 체크 시각 } } */
    getAttendance: function (studentId) {
      return read(DATA + "attendance", {})[studentId] || {};
    },
    checkIn: function (studentId, week) {
      var all = read(DATA + "attendance", {});
      all[studentId] = all[studentId] || {};
      if (!all[studentId][week]) all[studentId][week] = now();
      return save("attendance", all);
    },

    /* 과제 제출: { 학번: { 주차: { fileName, size, type, at, late, count } } }
       시연용이라 파일 내용은 저장하지 않고 파일 정보만 기록합니다. */
    getSubmissions: function (studentId) {
      return read(DATA + "submissions", {})[studentId] || {};
    },
    submit: function (studentId, week, file, late) {
      var all = read(DATA + "submissions", {});
      all[studentId] = all[studentId] || {};
      var prev = all[studentId][week];
      all[studentId][week] = {
        fileName: file.name,
        size: file.size,
        type: file.type,
        at: now(),
        late: !!late,
        count: prev ? prev.count + 1 : 1,
      };
      return save("submissions", all);
    },

    /* 관리자용: 전체 기록 */
    allAttendance: function () { return read(DATA + "attendance", {}); },
    allSubmissions: function () { return read(DATA + "submissions", {}); },

    /* 수강생 명단: [{ id, name, major, email }] — 명단이 비어 있지 않으면 명단에 있는 학생만 로그인됩니다 */
    getRoster: function () { return read(DATA + "roster", []); },
    saveRoster: function (list) { return save("roster", list); },

    /* 공지: [{ id, title, body, pinned, at }] */
    /* 이 브라우저에서 관리자가 공지를 고친 적이 있으면 그 공지를, 없으면 사이트 파일에 담긴 공지(noticeList)를 씁니다 */
    getNotices: function () {
      var local = read(DATA + "notices", null);
      if (Array.isArray(local)) return local;
      var pub = (window.SITE_CONFIG && window.SITE_CONFIG.noticeList) || [];
      return JSON.parse(JSON.stringify(pub));
    },
    saveNotices: function (list) { return save("notices", list); },

    /* 관리자가 고친 사이트 설정 */
    defaultConfig: function () { return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); },
    hasSavedConfig: function () { return !!read(DATA + "config", null); },
    saveConfig: function (cfg) { return write(DATA + "config", cfg); },
    clearConfig: function () {
      try { localStorage.removeItem(DATA + "config"); } catch (e) { /* 무시 */ }
    },
  };
})();
</script>
<script>
/* ===== app ===== */
/* 설정(SITE_CONFIG)을 읽어 화면을 그립니다. 내용 수정은 맨 위 설정 부분에서 하세요. */
(function () {
  "use strict";

  var C = window.SITE_CONFIG;
  if (!C) {
    document.body.insertAdjacentHTML("afterbegin", "<p style='padding:24px'>사이트 설정을 불러오지 못했습니다. 설정 부분의 문법(쉼표·따옴표)을 확인해 주세요.</p>");
    return;
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function get(path) {
    return path.split(".").reduce(function (obj, key) {
      return obj ? obj[key] : undefined;
    }, C);
  }

  function list(items, fn) {
    return (items || []).map(fn).join("");
  }

  function sectionHead(title, lead) {
    return (
      '<div class="section-head">' +
      '<h2 class="section-title">' + esc(title) + "</h2>" +
      (lead ? '<p class="section-lead">' + esc(lead) + "</p>" : "") +
      "</div>"
    );
  }

  function fill(id, html) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = '<div class="container">' + html + "</div>";
  }

  /* 단순 텍스트 바인딩 */
  document.querySelectorAll("[data-bind]").forEach(function (el) {
    el.textContent = get(el.getAttribute("data-bind")) || "";
  });
  document.title = C.site.title + " | " + C.site.university + " " + C.site.department;

  /* 메뉴 */
  var nav = document.getElementById("site-nav");
  nav.innerHTML = list(C.nav, function (item) {
    return '<a href="#' + esc(item.id) + '" data-target="' + esc(item.id) + '">' + esc(item.label) + "</a>";
  });

  /* 날짜 도우미 */
  var DAY = 86400000;
  var WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function parseDate(s) {
    var p = String(s).split(/[-T: ]/).map(Number);
    return new Date(p[0], p[1] - 1, p[2], p[3] || 0, p[4] || 0);
  }
  function addDays(d, n) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes());
  }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fmtDate(d) { return d.getMonth() + 1 + "월 " + d.getDate() + "일 (" + WEEKDAYS[d.getDay()] + ")"; }
  function fmtDateTime(d) { return fmtDate(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function fmtDot(d) { return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()); }

  /* 주차별 수업 날짜 · 과제 마감 계산 (startDate부터 매주, 휴강일은 건너뜀) */
  var cur = C.curriculum;
  var holidayMap = {};
  var classByDate = {};
  var dueByDate = {};
  (cur.holidays || []).forEach(function (hd) { holidayMap[hd.date] = hd.name; });
  (function () {
    var d = parseDate(cur.startDate);
    cur.weeks.forEach(function (w) {
      if (w.date) d = parseDate(w.date);
      else while (holidayMap[dateKey(d)]) d = addDays(d, 7);
      w._date = d;
      w._time = w.time || cur.defaultTime;
      w._place = w.place || cur.defaultPlace;
      classByDate[dateKey(d)] = w;
      if (w.assignment) {
        var a = w.assignment;
        if (a.due) {
          a._due = parseDate(a.due);
        } else {
          a._due = addDays(d, 6);
          a._due.setHours(23, 59, 0, 0);
        }
        var k = dateKey(a._due);
        (dueByDate[k] = dueByDate[k] || []).push(w);
      }
      d = addDays(d, 7);
    });
  })();
  var firstClass = cur.weeks[0]._date;
  var lastClass = cur.weeks[cur.weeks.length - 1]._date;
  var rangeText = fmtDot(firstClass) + " – " + pad(lastClass.getMonth() + 1) + "." + pad(lastClass.getDate());

  /* 마감까지 남은 시간 */
  function remaining(due) {
    var diff = due - new Date();
    if (diff <= 0) return { text: "마감되었습니다", state: "closed" };
    var d = Math.floor(diff / DAY);
    var h = Math.floor((diff % DAY) / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var text = (d > 0 ? d + "일 " : "") + (d > 0 || h > 0 ? h + "시간 " : "") + m + "분 남음";
    var now = new Date();
    var dDays = Math.round(
      (new Date(due.getFullYear(), due.getMonth(), due.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / DAY
    );
    return { text: (dDays === 0 ? "D-day" : "D-" + dDays) + " · " + text, state: diff < DAY ? "urgent" : "open" };
  }

  /* 첫 화면 */
  var h = C.hero;
  document.querySelector(".hero .container").innerHTML =
    '<div class="hero-inner">' +
    '<div class="hero-text">' +
    '<span class="badge">' + esc(h.badge) + "</span>" +
    '<h1 id="hero-title">' +
    (h.titleEmoji ? '<span class="title-emoji" aria-hidden="true">' + esc(h.titleEmoji) + "</span>" : "") +
    esc(h.title) +
    "</h1>" +
    '<p class="hero-subtitle">' + esc(h.subtitle) + "</p>" +
    '<p class="hero-desc">' + esc(h.description) + "</p>" +
    '<div class="hero-buttons">' +
    list(h.buttons, function (b) {
      return '<a class="btn ' + (b.primary ? "btn-primary" : "btn-ghost") + '" href="' + esc(b.href) + '">' + esc(b.label) + "</a>";
    }) +
    "</div></div>" +
    '<div class="slips" aria-hidden="true"><div class="slips-row">' +
    list(h.slips, function (text, i) {
      var tilt = ((i * 37) % 7) - 3; // 쪽마다 살짝 다른 기울기
      return '<span class="slip" lang="zh-CN" style="--tilt:' + tilt * 0.4 + 'deg">' + esc(text) + "</span>";
    }) +
    "</div></div></div>" +
    '<ul class="facts">' +
    list(h.facts, function (f) {
      return (
        '<li class="fact"><span class="fact-icon" aria-hidden="true">' + esc(f.icon) + "</span>" +
        "<div><span class=\"fact-label\">" + esc(f.label) + "</span><strong>" + esc(f.value === "auto:range" ? rangeText : f.value) + "</strong></div></li>"
      );
    }) +
    "</ul>";

  /* 숫자 강조 카드 */
  var toolCount = (C.tools && C.tools.items ? C.tools.items.length : 0);
  fill(
    "stats",
    '<ul class="grid grid-4 stats">' +
      list(C.stats, function (s) {
        var value = s.value === "auto:tools" ? toolCount : s.value;
        return (
          '<li class="card stat"><strong><span class="stat-value">' + esc(value) + "</span>" +
          '<span class="stat-unit">' + esc(s.unit) + "</span></strong>" +
          "<span class=\"stat-label\">" + esc(s.label) + "</span></li>"
        );
      }) +
      "</ul>"
  );

  /* 프로그램 소개 — 장점 슬라이드 */
  var intro = C.intro;
  fill(
    "intro",
    sectionHead(intro.title, intro.lead) +
      '<div class="slider" aria-roledescription="carousel">' +
      '<button class="slider-btn prev" type="button" aria-label="이전 장점">‹</button>' +
      '<ul class="slider-track" tabindex="0">' +
      list(intro.slides, function (s, i) {
        return (
          '<li class="card slide" aria-label="' + (i + 1) + " / " + intro.slides.length + '">' +
          '<span class="feature-icon" aria-hidden="true">' + esc(s.icon) + "</span>" +
          "<h3>" + esc(s.title) + "</h3><p>" + esc(s.text) + "</p></li>"
        );
      }) +
      "</ul>" +
      '<button class="slider-btn next" type="button" aria-label="다음 장점">›</button>' +
      "</div>" +
      '<div class="slider-dots" role="tablist">' +
      list(intro.slides, function (s, i) {
        return '<button type="button" role="tab" aria-label="' + esc(s.title) + '" data-index="' + i + '"></button>';
      }) +
      "</div>"
  );

  /* 커리큘럼 — 주차별 펼침 목록 */
  function assignmentHTML(a) {
    var url = a.submitUrl || cur.submitUrl;
    return (
      '<div class="assignment">' +
      '<div class="assignment-head"><span class="tag tag-req">과제</span><strong>' + esc(a.title) + "</strong></div>" +
      "<p>" + esc(a.desc) + "</p>" +
      '<div class="assignment-foot">' +
      '<div class="due"><span class="due-label">마감</span> <strong>' + esc(fmtDateTime(a._due)) + "</strong>" +
      '<span class="countdown" data-due="' + a._due.getTime() + '"></span></div>' +
      (url
        ? '<a class="btn btn-primary btn-sm submit-btn" href="' + esc(url) + '" target="_blank" rel="noopener" data-due="' + a._due.getTime() + '">제출하기</a>'
        : '<a class="btn btn-primary btn-sm" href="#classroom">내 강의실에서 제출</a>') +
      "</div></div>"
    );
  }

  fill(
    "curriculum",
    sectionHead(cur.title, cur.lead) +
      '<div class="week-list">' +
      list(cur.weeks, function (w) {
        var exam = w.type === "exam";
        var a = w.assignment;
        return (
          '<details class="card week-item' + (exam ? " week-exam" : "") + '" id="week-' + esc(w.week) + '">' +
          "<summary>" +
          '<span class="week-num">' + esc(w.week) + "주차</span>" +
          '<span class="week-sum"><strong>' + esc(w.title) + "</strong>" +
          '<span class="week-date">' + esc(fmtDate(w._date)) + " · " + esc(w.note) + "</span></span>" +
          (a ? '<span class="tag tag-hw">과제</span>' : "") +
          (exam ? '<span class="tag tag-exam">시험</span>' : "") +
          "</summary>" +
          '<div class="week-body">' +
          '<dl class="week-meta">' +
          "<div><dt>날짜 · 시간</dt><dd>" + esc(fmtDate(w._date)) + " " + esc(w._time) + "</dd></div>" +
          "<div><dt>수업 장소</dt><dd>" + esc(w._place) + "</dd></div>" +
          (w.expression ? '<div><dt>핵심 표현</dt><dd class="week-expr" lang="zh-CN">' + esc(w.expression) + "</dd></div>" : "") +
          "</dl>" +
          "<h4>학습 내용</h4>" +
          '<ul class="week-content">' + list(w.content, function (c) { return "<li>" + esc(c) + "</li>"; }) + "</ul>" +
          (w.videos && w.videos.length
            ? "<h4>참고 영상</h4>" +
              '<ul class="video-links">' +
              list(w.videos, function (v) {
                return '<li><a href="' + esc(v.url) + '" target="_blank" rel="noopener"><span aria-hidden="true">▶</span> ' + esc(v.title) + "</a></li>";
              }) +
              "</ul>"
            : "") +
          (a ? assignmentHTML(a) : "") +
          "</div></details>"
        );
      }) +
      "</div>"
  );

  /* 수업 달력 */
  fill(
    "calendar",
    sectionHead(C.calendar.title, C.calendar.lead) +
      '<div class="cal-layout">' +
      '<div class="card cal">' +
      '<div class="cal-head">' +
      '<button class="cal-nav" type="button" data-dir="-1" aria-label="이전 달">‹</button>' +
      '<h3 class="cal-title" aria-live="polite"></h3>' +
      '<button class="cal-nav" type="button" data-dir="1" aria-label="다음 달">›</button>' +
      "</div>" +
      '<div class="cal-grid cal-weekdays">' + list(WEEKDAYS, function (d) { return "<span>" + d + "</span>"; }) + "</div>" +
      '<div class="cal-grid cal-days"></div>' +
      '<div class="cal-legend"><span><i class="lg-class"></i>수업</span><span><i class="lg-due"></i>과제 마감</span><span><i class="lg-holiday"></i>휴강</span></div>' +
      "</div>" +
      '<div class="card cal-detail" aria-live="polite"></div>' +
      "</div>"
  );

  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var inSemester = today >= firstClass && today <= lastClass;
  var view = inSemester ? new Date(today.getFullYear(), today.getMonth(), 1) : new Date(firstClass.getFullYear(), firstClass.getMonth(), 1);
  var selectedKey = dateKey(inSemester && classByDate[dateKey(today)] ? today : firstClass);
  var calDays = document.querySelector(".cal-days");
  var calDetail = document.querySelector(".cal-detail");

  function renderCalendar() {
    document.querySelector(".cal-title").textContent = view.getFullYear() + "년 " + (view.getMonth() + 1) + "월";
    var daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    var cells = Math.ceil((view.getDay() + daysInMonth) / 7) * 7;
    var start = addDays(view, -view.getDay());
    var html = "";
    for (var i = 0; i < cells; i++) {
      var d = addDays(start, i);
      var k = dateKey(d);
      var w = classByDate[k];
      var hol = holidayMap[k];
      var due = dueByDate[k];
      var cls = ["cal-day"];
      if (d.getMonth() !== view.getMonth()) cls.push("is-out");
      if (w) cls.push("is-class");
      if (w && w.type === "exam") cls.push("is-exam");
      if (hol) cls.push("is-holiday");
      if (due) cls.push("has-due");
      if (d.getTime() === today.getTime()) cls.push("is-today");
      if (k === selectedKey) cls.push("is-selected");
      var label = fmtDate(d) + (w ? ", " + w.week + "주차 수업" : "") + (hol ? ", " + hol : "") + (due ? ", 과제 마감" : "");
      html +=
        '<button type="button" class="' + cls.join(" ") + '" data-date="' + k + '" aria-label="' + esc(label) + '"' +
        (k === selectedKey ? ' aria-pressed="true"' : "") + ">" +
        '<span class="cal-num">' + d.getDate() + "</span>" +
        (w ? '<span class="cal-tag">' + w.week + "주</span>" : "") +
        (hol ? '<span class="cal-tag">휴강</span>' : "") +
        (due ? '<span class="cal-dot" aria-hidden="true"></span>' : "") +
        "</button>";
    }
    calDays.innerHTML = html;
  }

  function showDay(k) {
    var d = parseDate(k);
    var w = classByDate[k];
    var hol = holidayMap[k];
    var dues = dueByDate[k] || [];
    var html = '<p class="detail-date">' + esc(fmtDate(d)) + "</p>";
    if (w) {
      html +=
        "<h3>" + esc(w.week) + "주차 · " + esc(w.title) + "</h3>" +
        '<dl class="week-meta">' +
        "<div><dt>시간</dt><dd>" + esc(w._time) + "</dd></div>" +
        "<div><dt>장소</dt><dd>" + esc(w._place) + "</dd></div>" +
        (w.expression ? '<div><dt>핵심 표현</dt><dd class="week-expr" lang="zh-CN">' + esc(w.expression) + "</dd></div>" : "") +
        "</dl>" +
        '<ul class="week-content">' + list(w.content, function (c) { return "<li>" + esc(c) + "</li>"; }) + "</ul>" +
        (w.assignment ? '<p class="detail-hw"><span class="tag tag-hw">과제</span> ' + esc(w.assignment.title) + " · 마감 " + esc(fmtDateTime(w.assignment._due)) + "</p>" : "") +
        '<button type="button" class="btn btn-ghost btn-sm open-week" data-week="' + esc(w.week) + '">주차 자세히 보기</button>';
    } else if (hol) {
      html += "<h3>" + esc(hol) + "</h3><p>이날은 수업이 없습니다. 다음 주 수업으로 일정이 밀립니다.</p>";
    } else {
      var next = cur.weeks.filter(function (x) { return x._date > d; })[0];
      html +=
        '<h3 class="detail-empty">수업이 없는 날입니다</h3>' +
        (next ? "<p>다음 수업: " + esc(fmtDate(next._date)) + " · " + esc(next.week) + "주차 " + esc(next.title) + "</p>" : "<p>이번 학기 수업이 모두 끝났습니다.</p>");
    }
    if (dues.length) {
      html +=
        '<div class="detail-due"><strong>이날 마감되는 과제</strong><ul>' +
        list(dues, function (x) {
          return "<li>" + esc(x.week) + "주차 · " + esc(x.assignment.title) + " (" + pad(x.assignment._due.getHours()) + ":" + pad(x.assignment._due.getMinutes()) + ")</li>";
        }) +
        "</ul></div>";
    }
    calDetail.innerHTML = html;
  }

  calDays.addEventListener("click", function (e) {
    var btn = e.target.closest(".cal-day");
    if (!btn) return;
    selectedKey = btn.getAttribute("data-date");
    var d = parseDate(selectedKey);
    if (d.getMonth() !== view.getMonth()) view = new Date(d.getFullYear(), d.getMonth(), 1);
    renderCalendar();
    showDay(selectedKey);
  });
  document.querySelectorAll(".cal-nav").forEach(function (btn) {
    btn.addEventListener("click", function () {
      view = new Date(view.getFullYear(), view.getMonth() + Number(btn.getAttribute("data-dir")), 1);
      renderCalendar();
    });
  });
  calDetail.addEventListener("click", function (e) {
    var btn = e.target.closest(".open-week");
    if (!btn) return;
    var item = document.getElementById("week-" + btn.getAttribute("data-week"));
    if (item) {
      item.open = true;
      item.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
  renderCalendar();
  showDay(selectedKey);

  /* 과제 마감 카운트다운 (1분마다 갱신) */
  function updateCountdowns() {
    document.querySelectorAll(".countdown").forEach(function (el) {
      var r = remaining(new Date(Number(el.getAttribute("data-due"))));
      el.textContent = r.text;
      el.className = "countdown is-" + r.state;
    });
    document.querySelectorAll(".submit-btn").forEach(function (el) {
      if (Number(el.getAttribute("data-due")) <= Date.now()) {
        el.textContent = "마감됨";
        el.classList.add("is-disabled");
        el.removeAttribute("href");
        el.setAttribute("aria-disabled", "true");
      }
    });
  }
  updateCountdowns();
  setInterval(updateCountdowns, 60000);

  /* participate.js에서 함께 쓰는 도우미 */
  window.SiteUtil = {
    esc: esc,
    list: list,
    fill: fill,
    sectionHead: sectionHead,
    pad: pad,
    dateKey: dateKey,
    fmtDate: fmtDate,
    fmtDateTime: fmtDateTime,
    remaining: remaining,
    updateCountdowns: updateCountdowns,
  };

  /* AI 도구 */
  var t = C.tools;
  fill(
    "tools",
    sectionHead(t.title, t.lead) +
      '<ul class="grid grid-4 tools">' +
      list(t.items, function (tool) {
        return (
          '<li class="card tool"><span class="feature-icon" aria-hidden="true">' + esc(tool.icon) + "</span>" +
          "<h3>" + esc(tool.name) + "</h3><p>" + esc(tool.use) + "</p></li>"
        );
      }) +
      "</ul>"
  );

  /* 수강 안내 — 준비물 · 평가 · 유의 사항 */
  var g = C.guide;
  fill(
    "guide",
    sectionHead(g.title, g.lead) +
      '<div class="grid grid-2">' +
      '<div class="card"><h3>수강 준비물</h3><ul class="materials">' +
      list(g.materials, function (m) {
        return (
          "<li><span class=\"tag " + (m.required ? "tag-req" : "tag-opt") + "\">" + (m.required ? "필수" : "권장") + "</span>" +
          "<div><strong>" + esc(m.item) + "</strong><span>" + esc(m.detail) + "</span></div></li>"
        );
      }) +
      "</ul></div>" +
      '<div class="card"><h3>평가 방법</h3><ul class="grading">' +
      list(g.grading, function (r) {
        return (
          "<li><div class='grading-row'><span>" + esc(r.item) + "</span><strong>" + esc(r.percent) + "%</strong></div>" +
          '<div class="bar"><span style="width:' + Number(r.percent) + '%"></span></div></li>'
        );
      }) +
      "</ul></div></div>" +
      '<div class="card notes"><h3>유의 사항</h3><ul>' +
      list(g.notes, function (n) { return "<li>" + esc(n) + "</li>"; }) +
      "</ul></div>"
  );

  /* FAQ */
  var f = C.faq;
  fill(
    "faq",
    sectionHead(f.title) +
      '<div class="faq-list">' +
      list(f.items, function (item) {
        return '<details class="card faq-item"><summary>' + esc(item.q) + "</summary><p>" + esc(item.a) + "</p></details>";
      }) +
      "</div>"
  );

  /* 푸터 — 교수자 사진 · 소개 · 연락처 */
  var p = C.instructor;
  var avatar = p.photo
    ? '<img class="avatar" src="' + esc(p.photo) + '" alt="' + esc(p.name) + ' 사진" />'
    : '<span class="avatar" aria-hidden="true">' + esc(String(p.name).replace(/[\[\]]/g, "").charAt(0) || "教") + "</span>";
  document.getElementById("instructor").innerHTML =
    '<div class="container">' +
    '<div class="footer-profile">' + avatar +
    '<div class="profile-body">' +
    '<p class="footer-eyebrow">' + esc(p.title) + "</p>" +
    "<h2>" + esc(p.name) +
    (p.nameAlt ? ' <span class="name-alt">' + esc(p.nameAlt) + "</span>" : "") +
    " <small>" + esc(p.position) + "</small></h2>" +
    '<p class="profile-aff">' + esc(p.affiliation) +
    (p.affiliationEn ? '<span class="profile-aff-en">' + esc(p.affiliationEn) + "</span>" : "") +
    "</p>" +
    (p.roles && p.roles.length ? '<ul class="profile-roles">' + list(p.roles, function (r) { return "<li>" + esc(r) + "</li>"; }) + "</ul>" : "") +
    (p.bio ? '<p class="profile-bio">' + esc(p.bio) + "</p>" : "") +
    "</div>" +
    '<dl class="footer-contacts">' +
    list(p.contacts, function (c) {
      var v = c.links
        ? c.links
            .map(function (l) { return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.text || l.url) + "</a>"; })
            .join(" / ")
        : c.href
          ? '<a href="' + esc(c.href) + '">' + esc(c.value) + "</a>"
          : esc(c.value);
      return "<div><dt>" + esc(c.label) + "</dt><dd>" + v + "</dd></div>";
    }) +
    "</dl></div>" +
    '<div class="footer-bottom">' +
    "<p>" + esc(C.footer.copyright) + "</p>" +
    (C.footer.links && C.footer.links.length
      ? '<p class="footer-links">' +
        C.footer.links
          .map(function (l) {
            return (
              '<span><span aria-hidden="true">' + esc(l.icon) + "</span> " + esc(l.label) + ": " +
              '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.text || l.url) + "</a></span>"
            );
          })
          .join('<span class="footer-sep" aria-hidden="true"> · </span>') +
        "</p>"
      : "") +
    "</div>" +
    "</div>";

  /* 장점 슬라이드 동작 */
  var track = document.querySelector(".slider-track");
  var dots = document.querySelectorAll(".slider-dots button");
  if (track) {
    var slides = track.children;
    var step = function () {
      return slides.length > 1 ? slides[1].offsetLeft - slides[0].offsetLeft : track.clientWidth;
    };
    var current = function () {
      return Math.round(track.scrollLeft / step());
    };
    var goTo = function (i) {
      track.scrollTo({ left: i * step(), behavior: "smooth" });
    };
    var sync = function () {
      var i = current();
      var atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
      dots.forEach(function (d, k) {
        var on = k === i || (atEnd && k === dots.length - 1 && i < k);
        d.classList.toggle("active", on);
        d.setAttribute("aria-selected", String(on));
      });
      document.querySelector(".slider-btn.prev").disabled = track.scrollLeft <= 4;
      document.querySelector(".slider-btn.next").disabled = atEnd;
    };
    document.querySelector(".slider-btn.prev").addEventListener("click", function () { goTo(current() - 1); });
    document.querySelector(".slider-btn.next").addEventListener("click", function () { goTo(current() + 1); });
    dots.forEach(function (d) {
      d.addEventListener("click", function () { goTo(Number(d.getAttribute("data-index"))); });
    });
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { e.preventDefault(); goTo(current() + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); goTo(current() - 1); }
    });
    track.addEventListener("scroll", sync, { passive: true });
    window.addEventListener("resize", sync);
    sync();
  }

  /* 모바일 메뉴 열고 닫기 */
  var toggle = document.querySelector(".menu-toggle");
  function setMenu(open) {
    document.body.classList.toggle("menu-open", open);
    toggle.setAttribute("aria-expanded", String(open));
    toggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
  }
  toggle.addEventListener("click", function () {
    setMenu(!document.body.classList.contains("menu-open"));
  });
  nav.addEventListener("click", function (e) {
    var link = e.target.closest("a");
    if (!link) return;
    setMenu(false);
    /* 짧은 섹션은 화면 가운데를 지나지 않을 수 있어 누른 메뉴를 바로 강조 */
    nav.querySelectorAll("a").forEach(function (a) { a.classList.toggle("active", a === link); });
  });

  /* 스크롤 시 헤더 그림자, 맨 위로 버튼 */
  var header = document.querySelector(".site-header");
  var toTop = document.querySelector(".to-top");
  function onScroll() {
    var y = window.scrollY;
    header.classList.toggle("scrolled", y > 8);
    toTop.classList.toggle("show", y > 400);
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  toTop.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* 현재 보고 있는 섹션의 메뉴 강조 */
  if ("IntersectionObserver" in window) {
    var links = nav.querySelectorAll("a");
    var observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          links.forEach(function (a) {
            a.classList.toggle("active", a.getAttribute("data-target") === entry.target.id);
          });
        });
      },
      { rootMargin: "-45% 0px -50% 0px" }
    );
    C.nav.forEach(function (item) {
      var el = document.getElementById(item.id);
      if (el) observer.observe(el);
    });
  }
})();
</script>
<script>
/* ===== participate ===== */
/* 수강생 참여 기능: 주제 투표 · 수강 신청서 · 내 강의실(로그인·출석·과제) · 안내 팝업 · 첫 방문 폭죽
   글과 선택지는 설정(SITE_CONFIG)에서, 저장 방식은 저장소(SiteStore) 부분에서 고칩니다. */
(function () {
  "use strict";

  var C = window.SITE_CONFIG;
  var U = window.SiteUtil;
  var S = window.SiteStore;
  if (!C || !U || !S) return;

  var esc = U.esc;
  var list = U.list;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* 받침에 따라 을/를 고르기 */
  function eulReul(word) {
    var code = String(word).charCodeAt(String(word).length - 1) - 0xac00;
    return code >= 0 && code <= 11171 && code % 28 > 0 ? "을" : "를";
  }
  function fmtTime(iso) {
    var d = new Date(iso);
    return U.fmtDate(d) + " " + U.pad(d.getHours()) + ":" + U.pad(d.getMinutes());
  }
  function fmtSize(bytes) {
    return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(bytes / 1024)) + "KB";
  }
  function setMsg(el, text, type) {
    el.textContent = text;
    el.className = "form-msg" + (type ? " is-" + type : "");
  }

  /* ===================== 공지사항 ===================== */
  var nt = C.notice;
  function sortedNotices() {
    return S.getNotices().slice().sort(function (a, b) {
      if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
      return a.at < b.at ? 1 : -1;
    });
  }
  function updateNoticeBadge() {
    var read = S.prefGet("noticeRead", []);
    var unread = S.getNotices().filter(function (n) { return read.indexOf(n.id) < 0; }).length;
    document.querySelectorAll('.site-nav a[data-target="notice"]').forEach(function (a) {
      var badge = a.querySelector(".nav-badge");
      if (unread && !badge) {
        badge = document.createElement("span");
        badge.className = "nav-badge";
        a.appendChild(badge);
      }
      if (badge) {
        if (unread) {
          badge.textContent = unread;
          badge.setAttribute("aria-label", "읽지 않은 공지 " + unread + "개");
        } else badge.remove();
      }
    });
  }
  var noticePage = 1;
  function renderNotices(focusList) {
    var all = sortedNotices();
    var read = S.prefGet("noticeRead", []);
    var per = Math.max(1, Number(nt.perPage) || 3);
    var pages = Math.max(1, Math.ceil(all.length / per));
    noticePage = Math.min(Math.max(1, noticePage), pages);
    var items = all.slice((noticePage - 1) * per, noticePage * per);
    var pager = "";
    if (pages > 1) {
      pager =
        '<nav class="notice-pager" aria-label="공지사항 페이지">' +
        '<button type="button" class="pager-btn" data-page="' + (noticePage - 1) + '"' + (noticePage === 1 ? " disabled" : "") + ' aria-label="이전 페이지">‹</button>' +
        Array.apply(null, Array(pages)).map(function (_, i) {
          var n = i + 1;
          return '<button type="button" class="pager-btn' + (n === noticePage ? " is-current" : "") + '" data-page="' + n + '"' +
            (n === noticePage ? ' aria-current="page"' : "") + ' aria-label="' + n + '페이지">' + n + "</button>";
        }).join("") +
        '<button type="button" class="pager-btn" data-page="' + (noticePage + 1) + '"' + (noticePage === pages ? " disabled" : "") + ' aria-label="다음 페이지">›</button>' +
        '<span class="pager-info">전체 ' + all.length + "건</span>" +
        "</nav>";
    }
    U.fill(
      "notice",
      U.sectionHead(nt.title, nt.lead) +
        (all.length
          ? '<div class="notice-list" tabindex="-1">' +
            list(items, function (n) {
              return (
                '<details class="card notice-item' + (n.pinned ? " is-pinned" : "") + '" data-id="' + esc(n.id) + '">' +
                "<summary>" +
                (n.pinned ? '<span class="tag tag-req">고정</span>' : "") +
                '<span class="notice-title">' + esc(n.title) + "</span>" +
                (read.indexOf(n.id) < 0 ? '<span class="tag tag-new">NEW</span>' : "") +
                '<span class="notice-date">' + esc(U.fmtDate(new Date(n.at))) + "</span>" +
                "</summary>" +
                '<div class="notice-body">' + esc(n.body).replace(/\n/g, "<br />") + "</div>" +
                "</details>"
              );
            }) +
            "</div>" + pager
          : '<div class="card notice-empty">' + esc(nt.empty) + "</div>")
    );
    updateNoticeBadge();
    if (focusList) document.querySelector("#notice .notice-list").focus({ preventScroll: true });
  }
  document.getElementById("notice").addEventListener("click", function (e) {
    var btn = e.target.closest(".pager-btn");
    if (!btn || btn.disabled) return;
    noticePage = Number(btn.getAttribute("data-page"));
    renderNotices(true);
  });
  document.getElementById("notice").addEventListener(
    "toggle",
    function (e) {
      var item = e.target;
      if (!item.classList || !item.classList.contains("notice-item") || !item.open) return;
      var id = item.getAttribute("data-id");
      var read = S.prefGet("noticeRead", []);
      if (read.indexOf(id) < 0) {
        read.push(id);
        S.prefSet("noticeRead", read);
      }
      var tag = item.querySelector(".tag-new");
      if (tag) tag.remove();
      updateNoticeBadge();
    },
    true
  );

  /* ===================== 주제 투표 ===================== */
  var poll = C.poll;
  /* 한 브라우저에 한 표 (로그인 여부와 관계없이 같은 표로 셈) */
  function voterKey() {
    return "b:" + S.browserId();
  }

  U.fill(
    "poll",
    U.sectionHead(poll.title, poll.lead) +
      '<div class="poll-layout">' +
      '<form class="card poll-form" novalidate>' +
      "<fieldset><legend>" + esc(poll.question) + "</legend>" +
      '<div class="poll-options">' +
      list(poll.options, function (o) {
        return (
          '<label class="poll-option"><input type="radio" name="poll" value="' + esc(o.id) + '" />' +
          '<span class="poll-icon" aria-hidden="true">' + esc(o.icon) + "</span>" +
          "<span>" + esc(o.label) + "</span></label>"
        );
      }) +
      "</div></fieldset>" +
      '<button class="btn btn-primary poll-submit" type="submit">투표하기</button>' +
      '<p class="form-msg" aria-live="polite"></p>' +
      "</form>" +
      '<div class="card poll-result">' +
      '<div class="poll-result-head"><h3>실시간 결과</h3><span class="poll-total"></span></div>' +
      '<ul class="poll-bars">' +
      list(poll.options, function (o) {
        return (
          '<li class="poll-bar" data-id="' + esc(o.id) + '">' +
          '<div class="poll-bar-label"><span>' + esc(o.icon) + " " + esc(o.label) + '<em class="mine-tag">내 선택</em></span><strong class="poll-count"></strong></div>' +
          '<div class="bar"><span style="width:0%"></span></div></li>'
        );
      }) +
      "</ul>" +
      '<p class="small-note">' + esc(poll.note) + "</p>" +
      "</div></div>"
  );

  var pollForm = document.querySelector(".poll-form");
  var pollMsg = pollForm.querySelector(".form-msg");

  function renderPoll() {
    var votes = S.getPoll().votes;
    var mine = votes[voterKey()];
    var counts = {};
    var total = 0;
    poll.options.forEach(function (o) { counts[o.id] = 0; });
    Object.keys(votes).forEach(function (k) {
      if (counts[votes[k]] != null) {
        counts[votes[k]]++;
        total++;
      }
    });
    var max = Math.max.apply(null, poll.options.map(function (o) { return counts[o.id]; }));
    document.querySelectorAll(".poll-bar").forEach(function (li) {
      var id = li.getAttribute("data-id");
      var c = counts[id];
      var pct = total ? Math.round((c / total) * 100) : 0;
      li.querySelector(".poll-count").textContent = c + "표 · " + pct + "%";
      li.querySelector(".bar span").style.width = pct + "%";
      li.classList.toggle("is-mine", id === mine);
      li.classList.toggle("is-top", c > 0 && c === max);
    });
    document.querySelector(".poll-total").textContent = "총 " + total + "표";
    pollForm.querySelectorAll("input").forEach(function (input) { input.checked = input.value === mine; });
    pollForm.querySelector(".poll-submit").textContent = mine ? "선택 바꾸기" : "투표하기";
  }

  pollForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var picked = pollForm.querySelector("input:checked");
    if (!picked) {
      setMsg(pollMsg, "주제를 하나 골라 주세요.", "error");
      return;
    }
    var changed = !!S.getPoll().votes[voterKey()];
    S.vote(voterKey(), picked.value);
    setMsg(pollMsg, changed ? "선택을 바꿨습니다." : "투표했습니다. 참여해 주셔서 고마워요!", "ok");
  });

  /* ===================== 수강 신청서 ===================== */
  var ap = C.apply;

  function fieldHTML(f) {
    var id = "ap-" + f.name;
    var req = f.required ? ' <span class="req" aria-hidden="true">*</span>' : "";
    var err = '<p class="field-error" id="' + id + '-err" hidden></p>';
    var wide = f.wide ? " field-wide" : "";
    var common = ' name="' + esc(f.name) + '" aria-describedby="' + id + '-err"' + (f.required ? ' aria-required="true"' : "");

    if (f.type === "radio") {
      return (
        '<fieldset class="field' + wide + '" data-field="' + esc(f.name) + '"><legend>' + esc(f.label) + req + "</legend>" +
        '<div class="choice-row">' +
        list(f.options, function (o, i) {
          return '<label class="choice"><input type="radio" id="' + id + "-" + i + '" value="' + esc(o) + '"' + common + " /> " + esc(o) + "</label>";
        }) +
        "</div>" + err + "</fieldset>"
      );
    }
    if (f.type === "checkbox") {
      return (
        '<div class="field field-check' + wide + '" data-field="' + esc(f.name) + '">' +
        '<label class="choice"><input type="checkbox" id="' + id + '"' + common + " /> " + esc(f.label) + req + "</label>" + err + "</div>"
      );
    }
    var control;
    if (f.type === "select") {
      control =
        '<select id="' + id + '"' + common + '><option value="">선택하세요</option>' +
        list(f.options, function (o) { return '<option value="' + esc(o) + '">' + esc(o) + "</option>"; }) +
        "</select>";
    } else if (f.type === "textarea") {
      control = '<textarea id="' + id + '" rows="4" placeholder="' + esc(f.placeholder || "") + '"' + common + "></textarea>";
    } else {
      control =
        '<input id="' + id + '" type="' + esc(f.type) + '" placeholder="' + esc(f.placeholder || "") + '"' +
        (f.autocomplete ? ' autocomplete="' + esc(f.autocomplete) + '"' : "") +
        (f.inputmode ? ' inputmode="' + esc(f.inputmode) + '"' : "") + common + " />";
    }
    return (
      '<div class="field' + wide + '" data-field="' + esc(f.name) + '">' +
      '<label for="' + id + '">' + esc(f.label) + req + "</label>" + control + err + "</div>"
    );
  }

  function renderApplyForm() {
    U.fill(
      "apply",
      U.sectionHead(ap.title, ap.lead) +
        '<form class="card apply-form" novalidate>' +
        '<div class="error-summary" role="alert" tabindex="-1" hidden></div>' +
        '<div class="form-grid">' + list(ap.fields, fieldHTML) + "</div>" +
        '<div class="form-actions"><button class="btn btn-primary" type="submit">' + esc(ap.submitLabel || "제출") + "</button></div>" +
        "</form>"
    );
    var form = document.querySelector(".apply-form");
    form.addEventListener("submit", onApplySubmit);
    form.addEventListener("input", function (e) {
      if (e.target.type === "tel") e.target.value = formatPhone(e.target.value);
      clearFieldError(e.target.name);
    });
    form.addEventListener("change", function (e) { clearFieldError(e.target.name); });
  }

  /* 휴대폰 번호에 하이픈 자동 입력: 01012345678 → 010-1234-5678 */
  function formatPhone(v) {
    var d = String(v).replace(/\D/g, "").slice(0, 11);
    if (d.length < 4) return d;
    if (d.length < 8) return d.slice(0, 3) + "-" + d.slice(3);
    if (d.length === 10) return d.slice(0, 3) + "-" + d.slice(3, 6) + "-" + d.slice(6);
    return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
  }

  function fieldValue(form, f) {
    if (f.type === "checkbox") return form.elements[f.name].checked;
    if (f.type === "radio") {
      var picked = form.querySelector('input[name="' + f.name + '"]:checked');
      return picked ? picked.value : "";
    }
    if (f.type === "tel") form.elements[f.name].value = formatPhone(form.elements[f.name].value);
    return form.elements[f.name].value.trim();
  }

  function showFieldError(name, msg) {
    var box = document.querySelector('.apply-form [data-field="' + name + '"]');
    if (!box) return;
    var err = box.querySelector(".field-error");
    err.textContent = msg;
    err.hidden = !msg;
    box.classList.toggle("has-error", !!msg);
    box.querySelectorAll("input, select, textarea").forEach(function (el) {
      if (msg) el.setAttribute("aria-invalid", "true");
      else el.removeAttribute("aria-invalid");
    });
  }
  function clearFieldError(name) {
    var box = name && document.querySelector('.apply-form [data-field="' + name + '"]');
    if (box && box.classList.contains("has-error")) showFieldError(name, "");
  }

  function onApplySubmit(e) {
    e.preventDefault();
    var form = e.target;
    var errors = [];
    var data = {};
    ap.fields.forEach(function (f) {
      var val = fieldValue(form, f);
      var msg = "";
      if (f.required && !val) {
        if (f.type === "checkbox") msg = "개인정보 수집·이용에 동의해 주세요.";
        else if (f.type === "radio" || f.type === "select") msg = f.label + eulReul(f.label) + " 선택해 주세요.";
        else msg = f.label + eulReul(f.label) + " 입력해 주세요.";
      } else if (val && f.pattern && !new RegExp(f.pattern).test(val)) {
        msg = f.patternMsg || f.label + " 형식을 확인해 주세요.";
      } else if (val && f.matches && val !== fieldValue(form, ap.fields.filter(function (x) { return x.name === f.matches; })[0])) {
        msg = f.matchMsg || f.label + "이(가) 일치하지 않습니다.";
      } else if (val && f.name === "userId" && findMember(val)) {
        msg = "이미 사용 중인 아이디입니다. 다른 아이디를 정해 주세요.";
      }
      showFieldError(f.name, msg);
      if (msg) errors.push({ id: "ap-" + f.name + (f.type === "radio" ? "-0" : ""), msg: msg });
      data[f.name] = val;
    });

    var summary = form.querySelector(".error-summary");
    if (errors.length) {
      summary.innerHTML =
        "<strong>빠진 항목이나 잘못 입력한 항목이 " + errors.length + "개 있습니다.</strong><ul>" +
        list(errors, function (er) { return '<li><a href="#' + er.id + '">' + esc(er.msg) + "</a></li>"; }) +
        "</ul>";
      summary.hidden = false;
      summary.focus();
      return;
    }
    summary.hidden = true;

    /* 비밀번호는 그대로 저장하지 않고 무작위 salt를 붙인 SHA-256 해시로만 저장 */
    var pw = data.password;
    ap.fields.forEach(function (f) { if (f.type === "password") delete data[f.name]; });
    var submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    var salt = randomSalt();
    hashPassword(salt, pw).then(function (hash) {
      data.pwSalt = salt;
      data.pwHash = hash;
      finishSignup(form, summary, data);
    }, function () {
      submitBtn.disabled = false;
      summary.innerHTML = "<strong>비밀번호를 처리하지 못했습니다.</strong> 페이지를 새로고침한 뒤 다시 시도해 주세요.";
      summary.hidden = false;
      summary.focus();
    });
  }

  function randomSalt() {
    var a = new Uint8Array(12);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function (_, i) { a[i] = Math.random() * 256; });
    return Array.prototype.map.call(a, function (x) { return (x < 16 ? "0" : "") + x.toString(16); }).join("");
  }
  function hashPassword(salt, pw) {
    if (!window.SiteAdmin || !window.SiteAdmin.sha256) return Promise.reject(new Error("no hash"));
    return window.SiteAdmin.sha256("kc2-member:" + salt + ":" + pw);
  }
  /* 아이디로 가입 기록 찾기 (같은 아이디가 여러 번 있으면 마지막 것) */
  function findMember(userId) {
    var all = S.listApplications().filter(function (r) { return r.data && r.data.userId === userId; });
    return all[all.length - 1] || null;
  }

  function finishSignup(form, summary, data) {
    var rec = S.submitApplication(data);
    if (!rec) {
      form.querySelector('button[type="submit"]').disabled = false;
      summary.innerHTML = "<strong>이 브라우저에서는 저장할 수 없습니다.</strong> 개인정보 보호 모드인지 확인해 주세요.";
      summary.hidden = false;
      summary.focus();
      return;
    }
    U.fill(
      "apply",
      U.sectionHead(ap.title, ap.lead) +
        '<div class="card apply-done" tabindex="-1">' +
        '<span class="done-mark" aria-hidden="true">✓</span>' +
        "<h3>" + esc(ap.successTitle) + "</h3>" +
        '<p class="done-no">회원번호 <strong>' + esc(rec.no) + "</strong> · " + esc(fmtTime(rec.at)) + "</p>" +
        "<p>" + esc(ap.successText) + "</p>" +
        '<dl class="done-summary">' +
        list(ap.fields.filter(function (f) { return f.type !== "checkbox" && data[f.name]; }), function (f) {
          return "<div><dt>" + esc(f.label) + "</dt><dd>" + esc(data[f.name]) + "</dd></div>";
        }) +
        "</dl>" +
        '<div class="done-actions"><a class="btn btn-primary" href="#classroom">내 강의실에서 로그인</a>' +
        '<button class="btn btn-ghost apply-again" type="button">다른 계정 가입</button></div>' +
        "</div>"
    );
    var done = document.querySelector(".apply-done");
    done.focus();
    done.querySelector(".apply-again").addEventListener("click", function () {
      renderApplyForm();
      document.getElementById("ap-" + ap.fields[0].name).focus();
    });
    var loginId = document.querySelector(".login-form [name=loginId]");
    if (loginId && data.userId) loginId.value = data.userId;
  }

  /* ===================== 내 강의실 ===================== */
  var cr = C.classroom;
  var weeks = C.curriculum.weeks;

  function todayStart() {
    var t = new Date();
    t.setHours(0, 0, 0, 0);
    return t;
  }

  function renderLogin() {
    U.fill(
      "classroom",
      U.sectionHead(cr.title, cr.lead) +
        '<form class="card login-form" novalidate>' +
        '<h3>로그인</h3>' +
        '<div class="field" data-field="loginId"><label for="login-id">아이디</label>' +
        '<input id="login-id" name="loginId" autocomplete="username" autocapitalize="off" placeholder="가입한 아이디" aria-describedby="login-id-err" />' +
        '<p class="field-error" id="login-id-err" hidden></p></div>' +
        '<div class="field" data-field="loginPw"><label for="login-pw">비밀번호</label>' +
        '<input id="login-pw" name="loginPw" type="password" autocomplete="current-password" aria-describedby="login-pw-err" />' +
        '<p class="field-error" id="login-pw-err" hidden></p></div>' +
        '<button class="btn btn-primary" type="submit">로그인</button>' +
        '<p class="small-note">' + esc(cr.loginNote) + ' <a href="#apply">회원가입하기</a></p>' +
        "</form>"
    );
    var form = document.querySelector(".login-form");
    function showErrors(idMsg, pwMsg) {
      [["loginId", idMsg], ["loginPw", pwMsg]].forEach(function (pair) {
        var box = form.querySelector('[data-field="' + pair[0] + '"]');
        var err = box.querySelector(".field-error");
        err.textContent = pair[1];
        err.hidden = !pair[1];
        box.classList.toggle("has-error", !!pair[1]);
      });
      if (idMsg) form.elements.loginId.focus();
      else if (pwMsg) form.elements.loginPw.focus();
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var id = form.elements.loginId.value.trim().toLowerCase();
      var pw = form.elements.loginPw.value;
      if (!id || !pw) return showErrors(id ? "" : "아이디를 입력해 주세요.", pw ? "" : "비밀번호를 입력해 주세요.");
      var member = findMember(id);
      if (!member || !member.data.pwHash) return showErrors("가입되지 않은 아이디입니다. 먼저 회원가입을 해 주세요.", "");
      hashPassword(member.data.pwSalt, pw).then(function (hash) {
        if (hash !== member.data.pwHash) {
          form.elements.loginPw.value = "";
          return showErrors("", "비밀번호가 맞지 않습니다.");
        }
        /* 수강생 명단이 등록되어 있으면 명단에 있는 학번만 로그인 */
        var roster = S.getRoster();
        if (roster.length && !roster.some(function (s) { return s.id === member.data.studentId; })) {
          return showErrors("수강생 명단에 없는 계정입니다. 교수자에게 문의해 주세요.", "");
        }
        showErrors("", "");
        S.login(member.data.studentId, member.data.name);
      }, function () {
        showErrors("", "로그인을 처리하지 못했습니다. 페이지를 새로고침해 주세요.");
      });
    });
  }

  function canCheck(w) {
    var t = todayStart();
    var d = w._date;
    if (U.dateKey(d) === U.dateKey(t)) return true;
    return cr.testMode && d < t;
  }

  function attendanceHTML(u) {
    var att = S.getAttendance(u.id);
    var t = todayStart();
    var todayWeek = weeks.filter(function (w) { return U.dateKey(w._date) === U.dateKey(t); })[0];
    var held = weeks.filter(function (w) { return w._date <= t; });
    var attended = held.filter(function (w) { return att[w.week]; }).length;
    var rate = held.length ? Math.round((attended / held.length) * 100) : 0;
    var next = weeks.filter(function (w) { return w._date > t; })[0];

    var todayBox;
    if (todayWeek) {
      todayBox = att[todayWeek.week]
        ? '<div class="today-box is-done">✓ 오늘 ' + todayWeek.week + "주차 출석 완료 <small>" + esc(fmtTime(att[todayWeek.week])) + "</small></div>"
        : '<div class="today-box"><p>오늘은 ' + todayWeek.week + "주차 수업일입니다.</p>" +
          '<button class="btn btn-primary check-in" type="button" data-week="' + todayWeek.week + '">오늘 출석 체크</button></div>';
    } else {
      todayBox =
        '<div class="today-box is-off"><p>오늘은 수업이 없습니다.</p>' +
        (next ? "<small>다음 수업: " + esc(U.fmtDate(next._date)) + " · " + next.week + "주차</small>" : "<small>이번 학기 수업이 모두 끝났습니다.</small>") +
        "</div>";
    }

    return (
      '<div class="card attend-card">' +
      '<div class="card-head"><h3>출석 체크</h3><span class="rate">출석률 <strong>' + rate + "%</strong> (" + attended + "/" + held.length + ")</span></div>" +
      todayBox +
      (cr.testMode ? '<p class="small-note">시연 모드: 지난 수업도 출석 체크할 수 있습니다.</p>' : "") +
      '<ul class="attend-list">' +
      list(weeks, function (w) {
        var status;
        if (att[w.week]) status = '<span class="chip chip-ok">출석</span><small>' + esc(fmtTime(att[w.week])) + "</small>";
        else if (w._date > t) status = '<span class="chip chip-wait">예정</span>';
        else status = '<span class="chip chip-miss">미출석</span>';
        var btn = !att[w.week] && canCheck(w)
          ? '<button class="btn btn-ghost btn-xs check-in" type="button" data-week="' + w.week + '">체크</button>'
          : "";
        return (
          "<li><span class=\"att-week\">" + w.week + "주차</span>" +
          '<span class="att-date">' + esc(U.fmtDate(w._date)) + "</span>" +
          '<span class="att-status">' + status + "</span>" + btn + "</li>"
        );
      }) +
      "</ul></div>"
    );
  }

  function submissionHTML(u) {
    var subs = S.getSubmissions(u.id);
    var now = Date.now();
    var items = weeks.filter(function (w) { return w.assignment; });
    return (
      '<div class="card submit-card">' +
      '<div class="card-head"><h3>과제 제출</h3><span class="rate">제출 <strong>' +
      items.filter(function (w) { return subs[w.week]; }).length + "/" + items.length + "</strong></span></div>" +
      '<ul class="sub-list">' +
      list(items, function (w) {
        var a = w.assignment;
        var s = subs[w.week];
        var closed = a._due.getTime() <= now;
        var locked = closed && !cr.allowLate;
        return (
          '<li class="sub-item">' +
          '<div class="sub-head"><strong>' + w.week + "주차 · " + esc(a.title) + "</strong>" +
          '<span class="countdown" data-due="' + a._due.getTime() + '"></span></div>' +
          '<p class="sub-due">마감 ' + esc(U.fmtDateTime(a._due)) + "</p>" +
          (s
            ? '<p class="sub-status">✓ <strong>' + esc(s.fileName) + "</strong> (" + fmtSize(s.size) + ") · " + esc(fmtTime(s.at)) +
              (s.late ? ' <span class="chip chip-miss">지각</span>' : "") +
              (s.count > 1 ? ' <span class="chip chip-wait">' + s.count + "번째 제출</span>" : "") + "</p>"
            : "") +
          (locked
            ? '<p class="sub-locked">마감되어 제출할 수 없습니다.</p>'
            : '<form class="sub-form" data-week="' + w.week + '" novalidate>' +
              '<label class="file-pick"><input type="file" name="file" accept="' + esc(cr.accept) + '" />' +
              '<span class="btn btn-ghost btn-sm">파일 선택</span></label>' +
              '<span class="file-name">선택된 파일 없음</span>' +
              '<button class="btn btn-primary btn-sm" type="submit">' + (s ? "다시 제출" : "제출하기") + "</button>" +
              '<p class="form-msg" aria-live="polite"></p>' +
              "</form>") +
          "</li>"
        );
      }) +
      "</ul>" +
      '<p class="small-note">시연용이라 파일 이름과 크기만 이 브라우저에 기록됩니다. 파일 보관은 서버를 연결한 뒤 가능합니다.</p>' +
      "</div>"
    );
  }

  function renderClassroom() {
    var u = S.currentUser();
    if (!u) return renderLogin();
    U.fill(
      "classroom",
      U.sectionHead(cr.title, cr.lead) +
        '<div class="card class-head">' +
        '<div><p class="eyebrow">내 강의실</p><h3>' + esc(u.name) + "님, 你好!</h3><p>학번 " + esc(u.id) + "</p></div>" +
        '<button class="btn btn-ghost btn-sm logout" type="button">로그아웃</button>' +
        "</div>" +
        '<div class="grid grid-2 class-grid">' + attendanceHTML(u) + submissionHTML(u) + "</div>"
    );
    U.updateCountdowns();
  }

  var classroomEl = document.getElementById("classroom");
  classroomEl.addEventListener("click", function (e) {
    var u = S.currentUser();
    var check = e.target.closest(".check-in");
    if (check && u) {
      S.checkIn(u.id, check.getAttribute("data-week"));
      return;
    }
    if (e.target.closest(".logout")) S.logout();
  });
  classroomEl.addEventListener("change", function (e) {
    if (e.target.type !== "file") return;
    var form = e.target.closest(".sub-form");
    var f = e.target.files[0];
    form.querySelector(".file-name").textContent = f ? f.name + " (" + fmtSize(f.size) + ")" : "선택된 파일 없음";
    setMsg(form.querySelector(".form-msg"), "", "");
  });
  classroomEl.addEventListener("submit", function (e) {
    var form = e.target.closest(".sub-form");
    if (!form) return;
    e.preventDefault();
    var u = S.currentUser();
    var msg = form.querySelector(".form-msg");
    var file = form.elements.file.files[0];
    if (!file) return setMsg(msg, "제출할 파일을 선택해 주세요.", "error");
    if (file.size > cr.maxFileMB * 1048576) return setMsg(msg, "파일이 너무 큽니다. " + cr.maxFileMB + "MB 이하로 올려 주세요.", "error");
    var ext = "." + file.name.split(".").pop().toLowerCase();
    if (cr.accept.split(",").indexOf(ext) < 0) return setMsg(msg, "올릴 수 없는 파일 형식입니다. (" + cr.accept + ")", "error");
    var w = weeks.filter(function (x) { return String(x.week) === form.getAttribute("data-week"); })[0];
    S.submit(u.id, w.week, file, Date.now() > w.assignment._due.getTime());
  });

  /* 저장된 내용이 바뀌면 (이 탭이든 다른 탭이든) 화면 다시 그리기 */
  S.onChange(function (topic) {
    if (topic === "poll") renderPoll();
    if (topic === "session" || topic === "attendance" || topic === "submissions") renderClassroom();
    if (topic === "notices") renderNotices();
  });

  renderNotices();
  renderPoll();
  renderApplyForm();
  renderClassroom();

  /* ===================== 수강 신청 안내 팝업 ===================== */
  var pp = C.popup;
  function tomorrowMidnight() {
    var t = todayStart();
    t.setDate(t.getDate() + 1);
    return t.getTime();
  }
  /* 팝업 틀: opts = { badge, title, html, cta: {label, href}, onToday } */
  function openPopup(opts) {
    if (document.querySelector(".modal-backdrop")) return;
    var lastFocus = document.activeElement;
    var wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<button class="modal-close" type="button" aria-label="닫기">×</button>' +
      '<div class="modal-body">' +
      '<span class="badge">' + esc(opts.badge) + "</span>" +
      '<h2 id="modal-title">' + esc(opts.title) + "</h2>" +
      opts.html +
      (opts.cta ? '<a class="btn btn-primary modal-cta" href="' + esc(opts.cta.href) + '">' + esc(opts.cta.label) + "</a>" : "") +
      "</div>" +
      '<div class="modal-foot">' +
      '<button class="modal-today" type="button">오늘 하루 보지 않기</button>' +
      '<button class="modal-dismiss" type="button">닫기</button>' +
      "</div></div>";
    document.body.appendChild(wrap);
    requestAnimationFrame(function () { wrap.classList.add("show"); });
    (wrap.querySelector(".modal-cta") || wrap.querySelector(".modal-dismiss")).focus();

    function close() {
      document.removeEventListener("keydown", onKey);
      wrap.classList.remove("show");
      setTimeout(function () { wrap.remove(); }, 250);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    function onKey(e) {
      if (e.key === "Escape") close();
      if (e.key === "Tab") {
        var items = wrap.querySelectorAll("a, button");
        var first = items[0];
        var last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener("keydown", onKey);
    wrap.addEventListener("click", function (e) {
      if (e.target === wrap || e.target.closest(".modal-close, .modal-dismiss, .modal-cta")) close();
      if (e.target.closest(".modal-today")) {
        opts.onToday();
        close();
      }
    });
  }

  /* 관리자가 「팝업으로 띄우기」를 고른 공지 (오늘 하루 보지 않기로 숨긴 것 제외) */
  function popupNotices() {
    var hidden = S.prefGet("noticePopupHide", {});
    return sortedNotices().filter(function (n) { return n.popup && !(hidden[n.id] > Date.now()); });
  }
  function openNoticePopup(items) {
    var read = S.prefGet("noticeRead", []);
    items.forEach(function (n) { if (read.indexOf(n.id) < 0) read.push(n.id); });
    S.prefSet("noticeRead", read);
    updateNoticeBadge();
    renderNotices();
    openPopup({
      badge: "📢 공지사항",
      title: items.length === 1 ? items[0].title : "새 공지 " + items.length + "건",
      html:
        '<div class="popup-notices">' +
        list(items, function (n) {
          return (
            '<article class="popup-notice">' +
            (items.length > 1 ? "<h3>" + (n.pinned ? "📌 " : "") + esc(n.title) + "</h3>" : "") +
            '<p class="popup-notice-date">' + esc(U.fmtDate(new Date(n.at))) + "</p>" +
            "<p>" + esc(n.body).replace(/\n/g, "<br />") + "</p>" +
            "</article>"
          );
        }) +
        "</div>",
      cta: { label: "공지사항 모두 보기", href: "#notice" },
      onToday: function () {
        var hidden = S.prefGet("noticePopupHide", {});

          x: W * b[0], y: H * b[1], vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          w: 4, h: 4, r: 0, vr: 0, c: colors[(Math.random() * colors.length) | 0], round: true, delay: b[2], spark: true,
